/* ✅ المستويات والشارات */
.section-lvl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.section-lvl-card .slc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.section-lvl-card .slc-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.section-lvl-card .slc-lvl{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800}
.section-lvl-card .slc-desc{font-size:11px;color:var(--muted);margin-bottom:6px}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.badge-item{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;text-align:center;opacity:.4;transition:opacity .3s,transform .3s}
.badge-item.unlocked{opacity:1;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card));transform:scale(1.02)}
.badge-item .b-icon{font-size:28px;display:block}
.badge-item .b-name{font-size:11px;font-weight:700;color:var(--text);margin-top:4px}
#levelsSummaryCard{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;cursor:pointer;transition:transform .2s}
#levelsSummaryCard:active{transform:scale(.98)}
.confetti-piece{position:fixed;width:10px;height:14px;z-index:9999;pointer-events:none;animation:confettiFall linear forwards;border-radius:2px}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.calc-button-style-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.calc-style-option{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--bg-soft);color:var(--text);font:inherit;font-size:12px;font-weight:700;text-align:start;cursor:pointer}

function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0}else{let d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break}h/=6}return[h*360,s*100,l*100]}

function hexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function rgba(hex,a){const[r,g,b]=hexToRgb(hex);return`rgba(${r},${g},${b},${a})`}

function load(){

      if(!DB.fitlife || typeof DB.fitlife!=='object') DB.fitlife={plans:[],todayDone:{}};

function fireConfetti(){
  try{
    const colors=['#4f7cff','#7a5cff','#22c58b','#ffb020','#ff5a6a','#a855f7','#f97316'];
    for(let i=0;i<60;i++){
      const p=document.createElement('div');
      p.className='confetti-piece';
      p.style.left=Math.random()*100+'vw';
      p.style.top='-20px';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration=(2+Math.random()*2)+'s';
      p.style.animationDelay=(Math.random()*0.4)+'s';
      p.style.transform='rotate('+(Math.random()*360)+'deg)';
      document.body.appendChild(p);
      setTimeout(()=>{try{p.remove()}catch(e){}},4500);
    }
  }catch(e){}
}

// Fix: define constants used by the Levels section. These were missing,
// which caused the Settings page to fail with 'LEVEL_THRESHOLDS is not defined'.
const LEVEL_THRESHOLDS = [0, 10, 25, 50, 100, 175, 275, 400, 550, 725, 925, 1150, 1400, 1700, 2050];
const BADGE_EMOJIS = {1:'🎯', 2:'💪', 3:'💰', 4:'📅', 5:'📚', 6:'💻', 7:'📄'};

function getSectionPoints(section){
  let points=0;
  try{
    switch(section){
      case 1: points=(DB.tasks||[]).filter(t=>t.done).length*2+(DB.habits||[]).filter(h=>(h.streak||0)>0).length*5+(DB.goals||[]).reduce((a,g)=>a+Math.round((g.progress||0)/10),0);break;
      case 2: points=Object.keys(DB.water||{}).length*1+Object.keys(DB.sleep||{}).length*2+(DB.exercises||[]).length*3+(DB.weights||[]).length*2+((DB.fitlife&&DB.fitlife.plans)||[]).length*4;break;
      case 3: {const entries=(DB.finance&&DB.finance.entries)||[];const inc=entries.filter(e=>e.type==='income').reduce((a,b)=>a+b.amount,0);const exp=entries.filter(e=>e.type==='expense').reduce((a,b)=>a+b.amount,0);points=entries.length*2+(inc>exp?10:0)+Math.floor(inc/100);break;}
      case 4: points=0;break; // التقارير لا تمنح نقاطًا ولا مستويات
      case 5: points=((DB.study&&DB.study.tasks)||[]).filter(t=>t.done).length*3;break;
      case 6: points=0;break; // المحرر لا يمنح نقاطًا ولا مستويات
      case 7: points=0;break; // قارئ PDF ومكتبته لا يمنحان نقاطًا ولا مستويات
      default: points=0;
    }
  }catch(e){console.warn('getSectionPoints error:',e);points=0}
  return points;
}
function getLevel(points){let lvl=0;for(let i=LEVEL_THRESHOLDS.length-1;i>=0;i--){if(points>=LEVEL_THRESHOLDS[i]){lvl=i+1;break}}return lvl}
function updateLevels(){
  try{
    if(!DB.levels||typeof DB.levels!=='object')DB.levels={};
    const sections=[1,2,3,5];
    // إزالة بيانات النقاط والمستويات القديمة للأقسام المستثناة: التقارير والمحرر وPDF.
    [4,6,7].forEach(sid=>{if(DB.levels && DB.levels[sid]) delete DB.levels[sid];});
    let newBadges=false;
    sections.forEach(sid=>{
      const pts=getSectionPoints(sid);
      const lvl=getLevel(pts);
      const oldLvl=(DB.levels[sid]&&DB.levels[sid].level)||0;
      if(lvl>oldLvl){
        DB.levels[sid]={level:lvl,points:pts};
        if(lvl>0){toast(`🎉 ${t('level_up')} ${lvl} — ${t('sec'+sid)}`);fireConfetti();newBadges=true}
      }else if(DB.levels[sid]){DB.levels[sid].points=pts}
    });
    return newBadges;
  }catch(e){console.warn('updateLevels error:',e);return false}
}

function save(){
  try{
    updateLevels();
    localStorage.setItem(APP_KEY,JSON.stringify(DB));
    if(DB.auth && DB.auth.isLoggedIn && DB.auth.uid && typeof firebase !== 'undefined' && firebase.firestore){
      try{
        const userData={joinedAt:localStorage.getItem('mylife_first_seen')||String(Date.now()),usageSeconds:Number(localStorage.getItem('mylife_usage_seconds')||0),usageDaily:JSON.parse(localStorage.getItem('mylife_usage_daily_v1')||'{}'),tasks:DB.tasks||[],habits:DB.habits||[],notes:DB.notes||[],water:DB.water||{},waterGoal:DB.waterGoal||8,sleep:DB.sleep||{},exercises:DB.exercises||[],weights:DB.weights||[],finance:DB.finance||{entries:[]},fitlife:DB.fitlife||{plans:[],todayDone:{}},study:DB.study||{tasks:[]},html:DB.html||{projects:[],currentCode:{html:'',css:'',js:''},currentName:''},dark:DB.dark||false,preferences:DB.preferences||DEFAULT_PREFS,goals:DB.goals||[],levels:DB.levels||{},profile:DB.profile||{},updatedAt:Date.now()};
        firebase.firestore().collection('users').doc(DB.auth.uid).set(userData,{merge:true}).catch(e=>console.warn('Cloud save failed:',e));
      }catch(e){console.warn('Cloud save error:',e)}
    }
  }catch(e){toast(t('storage_full'))}
}

function toEn(s){if(!['ar','fa','ur'].includes(LANG))return String(s);const a='٠١٢٣٤٥٦٧٨٩',e='0123456789';return String(s).replace(/[٠-٩]/g,d=>e[a.indexOf(d)])}

function arDate(ts,opts){const d=new Date(ts);const s=d.toLocaleDateString(getLocale(),opts||{weekday:'long',day:'2-digit',month:'long',year:'numeric'});return['ar','fa','ur'].includes(LANG)?toEn(s):s}
function arShort(ts){return arDate(ts,{day:'2-digit',month:'short'})}
function arFullTime(ts){const d=new Date(ts);const s=d.toLocaleDateString(getLocale(),{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});return['ar','fa','ur'].includes(LANG)?toEn(s):s}
function esc(s){return String(s).replace(/[&<>"\']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[c]})}
function dayName(d){return d.toLocaleDateString(getLocale(),{weekday:'short'})}
function fmtMoney(n){const s=n<0?'-':'';return s+toEn(Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2}))}
function fmtSize(b){if(!b)return'0';if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB'}

/* ============ ACHIEVEMENTS ============ */
const ACHIEVEMENTS=[
 {id:'first_task',icon:'🌱',ar:'بداية موفقة',en:'First Step',descAr:'أكمل أول مهمة',descEn:'Complete your first task',test:a=>a.completedTasks>=1},
 {id:'five_tasks',icon:'⚡',ar:'نشاط متزايد',en:'Getting Things Done',descAr:'أكمل 5 مهام',descEn:'Complete 5 tasks',test:a=>a.completedTasks>=5},
 {id:'seven_day_streak',icon:'🔥',ar:'استمرارية رائعة',en:'7-Day Streak',descAr:'أنجز مهامًا 7 أيام متتالية',descEn:'Complete tasks 7 days in a row',test:a=>a.streak>=7},
 {id:'thirty_tasks',icon:'💎',ar:'إنجاز مميز',en:'Diamond Achiever',descAr:'أكمل 30 مهمة',descEn:'Complete 30 tasks',test:a=>a.completedTasks>=30},
 {id:'hundred_tasks',icon:'👑',ar:'أسطورة الإنجاز',en:'Legend',descAr:'أكمل 100 مهمة',descEn:'Complete 100 tasks',test:a=>a.completedTasks>=100},
 {id:'ten_goals',icon:'🎯',ar:'صائد الأهداف',en:'Goal Hunter',descAr:'أكمل 10 أهداف',descEn:'Finish 10 goals',test:a=>a.completedGoals>=10}
];
function achievementState(){
 if(!DB.achievements||typeof DB.achievements!=='object')DB.achievements={unlocked:[],days:[],completedGoals:[]};
 const a=DB.achievements;if(!Array.isArray(a.unlocked))a.unlocked=[];if(!Array.isArray(a.days))a.days=[];if(!Array.isArray(a.completedGoals))a.completedGoals=[];
 const completedTasks=(DB.tasks||[]).filter(x=>x.done).length;
 const days=[...new Set(a.days)].sort();let streak=0;
 if(days.length){let cursor=new Date();cursor.setHours(0,0,0,0);const today=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');
 let last=days[days.length-1];if(last!==today){cursor.setDate(cursor.getDate()-1);const y=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(cursor.getDate()).padStart(2,'0');if(last===y)last=y;else last='';}
 if(last){let d=new Date(last+'T00:00:00');for(let i=days.length-1;i>=0;i--){const k=days[i],want=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(k!==want)break;streak++;d.setDate(d.getDate()-1)}}}
 return {completedTasks,completedGoals:a.completedGoals.length,streak};
}
function recordTaskAchievement(){const a=achievementState(),now=new Date(),key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');if(!DB.achievements.days.includes(key))DB.achievements.days.push(key);return checkAchievementUnlocks();}
function recordGoalAchievement(id){const a=achievementState();if(id&&!DB.achievements.completedGoals.includes(id))DB.achievements.completedGoals.push(id);return checkAchievementUnlocks();}
const ACHIEVEMENT_I18N={
ar:{title:'الأوسمة والإنجازات',unlocked:'تم الفتح',locked:'مقفل',notice:'🏅 إنجاز جديد: ',names:['بداية موفقة','نشاط متزايد','استمرارية رائعة','إنجاز مميز','أسطورة الإنجاز','صائد الأهداف'],descs:['أكمل أول مهمة','أكمل 5 مهام','أنجز مهامًا 7 أيام متتالية','أكمل 30 مهمة','أكمل 100 مهمة','أكمل 10 أهداف']},
en:{title:'Achievements',unlocked:'Unlocked',locked:'Locked',notice:'🏅 Achievement unlocked: ',names:['First Step','Getting Things Done','7-Day Streak','Diamond Achiever','Legend','Goal Hunter'],descs:['Complete your first task','Complete 5 tasks','Complete tasks 7 days in a row','Complete 30 tasks','Complete 100 tasks','Finish 10 goals']}};
function achievementCopy(){return ACHIEVEMENT_I18N[LANG]||ACHIEVEMENT_I18N.en}
function checkAchievementUnlocks(){const a=achievementState(),fresh=[];ACHIEVEMENTS.forEach((b,i)=>{if(!DB.achievements.unlocked.includes(b.id)&&b.test(a)){DB.achievements.unlocked.push(b.id);fresh.push({badge:b,index:i})}});const tr=achievementCopy();fresh.forEach(x=>toast(tr.notice+tr.names[x.index]));return fresh.length>0;}
function achievementsHTML(){const a=achievementState(),tr=achievementCopy();return `<section class="card achievement-card" aria-label="${tr.title}"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">🏅 ${tr.title}</h3><span class="p-badge">${DB.achievements.unlocked.length}/${ACHIEVEMENTS.length}</span></div><div class="achievement-grid">${ACHIEVEMENTS.map((b,i)=>{const ok=DB.achievements.unlocked.includes(b.id);return `<div class="achievement-tile ${ok?'earned':'locked'}"><span class="achievement-icon">${ok?b.icon:'🔒'}</span><b>${tr.names[i]}</b><small>${tr.descs[i]}</small><span class="achievement-status">${ok?tr.unlocked:tr.locked}</span></div>`}).join('')}</div></section>`}

let taskPriorityDraft=null,taskPriorityFilter='all';

routes.tasks=function(root,params){
  params=params||{};
  root.innerHTML=`<h2 class="page-title">${t('tasks')}</h2>${searchBarHTML('tasks',t('search'))}

  </div>
  <div class="row"><input id="ti" class="input" placeholder="${t('new_task')}"></div>
  <div class="field-lbl" style="margin-top:12px">⚡ ${t('priority_required')}</div>
  <div class="priority-selector" id="ps">
    ${Object.keys(PRIORITY_KEYS).map(k=>`<button type="button" class="priority-opt ${taskPriorityDraft===k?'active':''}" data-p="${k}"><span class="dot"></span><span class="opt-text"><b>${t(PRIORITY_KEYS[k].lbl)}</b><small>${t(PRIORITY_KEYS[k].hint)}</small></span></button>`).join('')}
  </div>
  <button class="btn full" id="ab" style="margin-top:6px">➕ ${t('add')}</button>
</div>
<div id="achievementPanel"></div><div class="list" id="tl"></div>`;
  const inp=root.querySelector('#ti'),list=root.querySelector('#tl'),q=()=>searchQueries.tasks;
  function getPriorityMeta(p){if(!p||!PRIORITY_KEYS[p])return null;return{cls:'prio-'+p,badge:'p-badge '+p,label:t(PRIORITY_KEYS[p].short)}}
  function draw(){
    const achievementPanel=root.querySelector('#achievementPanel');if(achievementPanel)achievementPanel.innerHTML=achievementsHTML();
    let items=filterList(DB.tasks,q(),['title']);
    if(taskPriorityFilter!=='all')items=items.filter(tk=>tk.priority===taskPriorityFilter);
    if(!items.length){list.innerHTML='<div class="empty">'+t('no_tasks')+'</div>';return}
    list.innerHTML=items.map(tk=>{const pm=getPriorityMeta(tk.priority);return`<div class="item ${tk.done?'done':''} ${pm?'has-priority '+pm.cls:''}" data-id="${tk.id}"><div class="check" data-act="toggle">✓</div><div class="txt">${esc(tk.title)}</div>${pm?`<span class="${pm.badge}">${pm.label}</span>`:''}<button class="del" data-act="del">✕</button></div>`}).join('');
  }
  function add(){
    const v=inp.value.trim();
    if(!v){toast(t('write_task'));return}
    if(!taskPriorityDraft){toast(t('priority_required'));return}
    DB.tasks.unshift({id:uid(),title:v,done:false,priority:taskPriorityDraft,created:Date.now()});
    inp.value='';taskPriorityDraft=null;save();routes.tasks(root);toast(t('taskAdded'));
  }
  const ab=root.querySelector('#ab');if(ab)ab.onclick=add;
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  root.querySelectorAll('#ps .priority-opt').forEach(b=>b.onclick=()=>{const p=b.dataset.p;if(taskPriorityDraft===p)taskPriorityDraft=null;else taskPriorityDraft=p;root.querySelectorAll('#ps .priority-opt').forEach(x=>x.classList.toggle('active',x.dataset.p===taskPriorityDraft))});
  root.querySelectorAll('#pf .priority-filter').forEach(b=>b.onclick=()=>{taskPriorityFilter=b.dataset.f;root.querySelectorAll('#pf .priority-filter').forEach(x=>x.classList.toggle('active',x.dataset.f===taskPriorityFilter));draw()});
  if(list)list.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('.item').dataset.id;const tk=DB.tasks.find(x=>x.id===id);if(!tk)return;if(b.dataset.act==='toggle'){tk.done=!tk.done;window._lastTaskToggled=id;if(tk.done)recordTaskAchievement()}else DB.tasks=DB.tasks.filter(x=>x.id!==id);save();draw();if(window._lastTaskToggled===id){const card=list.querySelector('.item[data-id="'+id+'"]');if(card&&tk.done)card.classList.add('task-complete-pop');window._lastTaskToggled=null}});
  bindSearch(root,'tasks',draw);draw();
  if(params.focus)setTimeout(()=>inp.focus(),300);
};

<div class="setting-row"><div class="s-label">${t('anim_speed')}</div><div class="seg" id="animSpeedSeg"><button type="button" class="seg-btn ${p.animSpeed==='fast'?'active':''}" data-as="fast">${t('anim_fast')}</button><button type="button" class="seg-btn ${p.animSpeed==='normal'?'active':''}" data-as="normal">${t('anim_normal')}</button><button type="button" class="seg-btn ${p.animSpeed==='slow'?'active':''}" data-as="slow">${t('anim_slow')}</button></div></div>
</div></div>
<div class="setting-group" data-group="sections">
<button class="setting-group-head" type="button"><div class="setting-group-icon">🗂️</div><div class="setting-group-info"><span class="setting-group-title">${t('sections_visible')}</span><span class="setting-group-desc">${t('sections_desc')}</span></div><span class="setting-group-arrow">›</span></button>
<div class="setting-group-body"><div class="section-toggle" id="secToggle">${allSections.map(sid=>{const s=SECTIONS[sid];const on=p.sections.includes(sid);const isLocked=MANDATORY_SECTIONS.includes(sid);return`<button type="button" data-sid="${sid}" class="${on?'on':''} ${isLocked?'locked':''}">${t(s.key).replace(/^\S+\s/,'')}</button>`}).join('')}</div></div></div>
<div class="setting-group" data-group="levels">
<button class="setting-group-head" type="button"><div class="setting-group-icon">🏆</div><div class="setting-group-info"><span class="setting-group-title">${t('levels')}</span><span class="setting-group-desc">${t('badges')}</span></div><span class="setting-group-arrow">›</span></button>
<div class="setting-group-body"><div id="levelsContent"></div></div>
</div>
<div class="setting-group" data-group="about">
<button class="setting-group-head" type="button"><div class="setting-group-icon">ℹ️</div><div class="setting-group-info"><span class="setting-group-title">${t('about')}</span><span class="setting-group-desc">${t('about_desc')}</span></div><span class="setting-group-arrow">›</span></button>
<div class="setting-group-body"><div style="text-align:center;padding:14px 0"><div style="font-size:52px;margin-bottom:8px">🌟</div><div style="font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--title-a),var(--title-b));-webkit-background-clip:text;background-clip:text;color:transparent">${t('appTitle')}</div><div style="color:var(--muted);font-size:13px;margin-top:4px">v${APP_VERSION}</div><button class="btn full" id="shareFromAbout" style="margin-top:14px">📤 ${t('share_app')}</button></div></div></div>
</div>`;

  const btnChangeName=root.querySelector('#btnChangeName');
  if(btnChangeName)btnChangeName.onclick=()=>{
    const modal=document.createElement('div');modal.className='modal custom-name-modal';
    modal.innerHTML=`<div class="box"><h3>✏️ ${t('change_name')}</h3><p>${t('change_name_desc')}</p><input type="text" class="input" id="newNameInput" value="${esc(DB.auth.username||'')}" placeholder="${t('name_placeholder')}"><div class="actions"><button class="btn ghost" id="cancelNameBtn">${t('cancel')}</button><button class="btn" id="saveNameBtn">${t('save')}</button></div></div>`;
    document.body.appendChild(modal);
    const input=modal.querySelector('#newNameInput');input.focus();
    const closeModal=()=>modal.remove();
    modal.querySelector('#cancelNameBtn').onclick=closeModal;
    modal.querySelector('#saveNameBtn').onclick=()=>{
      const newName=input.value.trim();if(!newName){toast(t('name_required'));return}
      DB.auth.username=newName;save();
      if(typeof firebase!=='undefined'&&firebase.auth&&firebase.auth().currentUser){firebase.auth().currentUser.updateProfile({displayName:newName}).catch(()=>{})}
      const nameEl=root.querySelector('#settingsUserName');if(nameEl)nameEl.textContent=newName;
      toast(t('savedSuccess'));closeModal();
    };
    modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
  };

  const btnLogout=root.querySelector('#btnLogout');
  if(btnLogout)btnLogout.onclick=()=>{
    confirmBox(t('change_account'),t('change_account_desc'),()=>{
      (async()=>{
        btnLogout.disabled=true;
        // يمنع مستمع Firebase من إعادة بناء الواجهة أثناء تبديل الحالة.
        window.__myLifeLoggingOut=true;
        const showLoginScreen=()=>{
          try{
            DB.auth={username:'',email:'',uid:'',isLoggedIn:false};
            try{save();}catch(saveError){console.warn('Could not save signed-out state:',saveError);}
            const appEl=document.querySelector('.app');
            if(appEl)appEl.style.display='none';
            const loginScreen=document.getElementById('loginScreen');
            if(loginScreen){loginScreen.style.display='flex';loginScreen.classList.remove('hidden');}
            const resetScreen=document.getElementById('resetScreen');
            if(resetScreen){resetScreen.style.display='none';resetScreen.classList.add('hidden');}
            const onb=document.getElementById('onboardingScreen');if(onb)onb.classList.add('hidden');
            document.body.classList.add('auth-flow');
            const authEmail=document.getElementById('authEmail');if(authEmail)authEmail.value='';
            const authPassword=document.getElementById('authPassword');if(authPassword)authPassword.value='';
            const authError=document.getElementById('authError');if(authError)authError.textContent='';
            const authSubmitBtn=document.getElementById('authSubmitBtn');
            if(authSubmitBtn){authSubmitBtn.disabled=false;authSubmitBtn.textContent=authMode==='signup'?t('login_submit_signup'):t('login_submit_login');}
          }catch(uiError){console.error('Unable to render login screen:',uiError);}
        };
        try{
          // حدّث الواجهة فوراً حتى لا يؤدي تأخر Firebase إلى تعليق زر الخروج.
          showLoginScreen();
          if(typeof firebase!=='undefined'&&firebase.auth){
            try{await Promise.race([firebase.auth().signOut(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('signOut timeout')),5000))]);}
            catch(signOutError){console.warn('Firebase signOut did not complete:',signOutError);}
          }
          toast(t('logged_out'));
        }catch(logoutError){
          console.error('Logout flow error:',logoutError);
          showLoginScreen();
        }finally{
          window.__myLifeLoggingOut=false;
          btnLogout.disabled=false;
        }
      })();
    });
  };

  // Organize preferences in a predictable order: appearance, layout, motion, sounds, content, progress, about.
  const settingsOrder=['appearance','layout','animations','calc-sound','sections','levels','about'];
  const settingsGroups=[...root.querySelectorAll('.setting-group')];
  settingsOrder.forEach(key=>{const group=settingsGroups.find(g=>g.dataset.group===key);if(group)root.appendChild(group)});
  const settingsStack=root.querySelector('.settings-stack');
  if(settingsStack){settingsStack.innerHTML=`<div class="settings-section-label">${LANG==='ar'?'تخصيص التطبيق':'APP PREFERENCES'}</div>`;}
  root.querySelectorAll('.setting-group').forEach(g=>{
    const head=g.querySelector('.setting-group-head');if(!head)return;
    const body=g.querySelector('.setting-group-body');
    head.setAttribute('aria-expanded','false');
    if(body){body.setAttribute('role','region');body.setAttribute('aria-label',head.querySelector('.setting-group-title')?.textContent||'Settings');}
    if(openSettingGroup===g.dataset.group){
      g.classList.add('open');head.setAttribute('aria-expanded','true');
      setTimeout(()=>{try{g.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}},150);
    }
    head.onclick=()=>{const isOpen=g.classList.contains('open');root.querySelectorAll('.setting-group').forEach(x=>{x.classList.remove('open');const h=x.querySelector('.setting-group-head');if(h)h.setAttribute('aria-expanded','false')});if(!isOpen){g.classList.add('open');head.setAttribute('aria-expanded','true');openSettingGroup=g.dataset.group}else{openSettingGroup=null}};
  });

  const qualityGrid=root.querySelector('#qualityProfileGrid');
  if(qualityGrid){
    const currentQuality=getQualityProfile();
    qualityGrid.querySelectorAll('[data-quality]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.quality===currentQuality);btn.onclick=()=>{
      const ar=LANG==='ar';const chosen=btn.dataset.quality;
      const msg=ar?'تغيير جودة التطبيق يدويًا على مسؤوليتك. إذا كان جهازك لا يتحمل المستوى المختار فقد تلاحظ بطئًا أو تقطعًا. هل تريد المتابعة؟':'Changing app quality manually is your responsibility. If your device cannot handle the selected level, the app may lag. Continue?';
      if(chosen===getQualityProfile())return;
      if(!window.confirm(msg))return;
      localStorage.setItem('mylife_quality_profile',chosen);localStorage.setItem('mylife_quality_manual','true');applyQualityProfile(chosen);
      qualityGrid.querySelectorAll('[data-quality]').forEach(x=>x.classList.toggle('active',x.dataset.quality===chosen));
      const info=root.querySelector('#qualityDeviceInfo');if(info)info.textContent=(ar?'المستوى الحالي: ':'Current level: ')+qualityLabel(chosen)+(ar?' · تم الاختيار يدويًا':' · Manually selected');
      toast(ar?'تم تغيير جودة التطبيق':'App quality updated');
    }});
    const info=root.querySelector('#qualityDeviceInfo');if(info){const d=getQualityDeviceInfo();info.textContent=(LANG==='ar'?'تقدير إمكانات الجهاز: ':'Device capability estimate: ')+d+' · '+(LANG==='ar'?'المستوى الحالي: ':'Current level: ')+qualityLabel(currentQuality)+(localStorage.getItem('mylife_quality_manual')==='true'?(LANG==='ar'?' · يدوي':' · Manual'):(LANG==='ar'?' · تلقائي':' · Automatic'));}
  }

  const calcSoundSelect=root.querySelector('#calcSoundSelect');
  if(calcSoundSelect)calcSoundSelect.onchange=e=>{p.calcSound=e.target.value;save();playCalcClick('key');toast(LANG==='ar'?'🔊 تم تغيير صوت الحاسبة':'🔊 Calculator sound changed')};
  const settingsAlarmSound=root.querySelector('#settingsAlarmSound');if(settingsAlarmSound)settingsAlarmSound.onchange=e=>{p.timerSound=e.target.value;save();toast(LANG==='ar'?'🔔 تم تغيير صوت المنبه':'🔔 Alarm sound changed')};
  const previewSettingsAlarm=root.querySelector('#previewSettingsAlarm');if(previewSettingsAlarm)previewSettingsAlarm.onclick=playStudyTimerAlarm;
  const previewCalcSound=root.querySelector('#previewCalcSound');
  if(previewCalcSound)previewCalcSound.onclick=()=>{playCalcClick('key');setTimeout(()=>playCalcClick('function'),110);setTimeout(()=>playCalcClick('equal'),220)};
  root.querySelectorAll('[data-calc-style]').forEach(btn=>btn.onclick=()=>{p.calcButtonStyle=btn.dataset.calcStyle;document.documentElement.dataset.calcButtonStyle=p.calcButtonStyle;save();root.querySelectorAll('[data-calc-style]').forEach(x=>x.classList.toggle('active',x===btn));playCalcClick('key');toast('🧮 تم تغيير شكل أزرار الحاسبة')});

  const langSel=root.querySelector('#langSelect');
  if(langSel)langSel.onchange=e=>{const newLang=e.target.value;if(!LANGS.includes(newLang))return;localStorage.setItem('life_organizer_lang',newLang);LANG=newLang;rebuildUIAfterLangChange();toast(LANG_META[newLang].flag+' '+LANG_META[newLang].name)};

  const setDark=root.querySelector('#setDark');
  if(setDark)setDark.onchange=e=>{applyTheme(e.target.checked);save()};
  
  root.querySelectorAll('#accentSwatches .swatch').forEach(sw=>sw.onclick=()=>{p.accent=sw.dataset.accent;applyPreferences();save();root.querySelectorAll('#accentSwatches .swatch').forEach(x=>x.classList.toggle('active',x.dataset.accent===p.accent));toast('🎨 '+accentName(p.accent))});
  root.querySelectorAll('#titleSeg .seg-btn').forEach(b=>b.onclick=()=>{p.titleAccent=b.dataset.tc;applyPreferences();save();root.querySelectorAll('#titleSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.tc===p.titleAccent));const wrap=root.querySelector('#titleCustomWrap');wrap.style.display=p.titleAccent==='custom'?'block':'none'});
  root.querySelectorAll('#titleSwatches .swatch').forEach(sw=>sw.onclick=()=>{const a=ACCENTS[sw.dataset.title];p.titleCustom1=a.p1;p.titleCustom2=a.p2;p.titleAccent='custom';applyPreferences();save();root.querySelectorAll('#titleSwatches .swatch').forEach(x=>x.classList.toggle('active',x===sw));root.querySelectorAll('#titleSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.tc==='custom'));root.querySelector('#titleCustomWrap').style.display='block'});
  
  const setGloss=root.querySelector('#setGloss');
  if(setGloss)setGloss.onchange=e=>{p.gloss=e.target.checked;applyPreferences();save()};
  
  root.querySelectorAll('#fontSeg .seg-btn').forEach(b=>b.onclick=()=>{p.fontSize=b.dataset.font;applyPreferences();save();root.querySelectorAll('#fontSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.font===p.fontSize))});
  root.querySelectorAll('#radiusSeg .seg-btn').forEach(b=>b.onclick=()=>{p.radius=b.dataset.rad;applyPreferences();save();root.querySelectorAll('#radiusSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.rad===p.radius))});
  root.querySelectorAll('#taskViewSeg .seg-btn').forEach(b=>b.onclick=()=>{p.taskView=b.dataset.tv;applyPreferences();save();root.querySelectorAll('#taskViewSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.tv===p.taskView))});
  root.querySelectorAll('#tableSeg .seg-btn').forEach(b=>b.onclick=()=>{p.tableStyle=b.dataset.ts;save();root.querySelectorAll('#tableSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.ts===p.tableStyle))});
  
  const setAnim=root.querySelector('#setAnim');
  if(setAnim)setAnim.onchange=e=>{p.animations=e.target.checked;applyPreferences();save()};
  root.querySelectorAll('#animSpeedSeg .seg-btn').forEach(b=>b.onclick=()=>{p.animSpeed=b.dataset.as;applyPreferences();save();root.querySelectorAll('#animSpeedSeg .seg-btn').forEach(x=>x.classList.toggle('active',x.dataset.as===p.animSpeed))});
  
  root.querySelectorAll('#secToggle button').forEach(b=>b.onclick=()=>{
    const sid=+b.dataset.sid;
    if(MANDATORY_SECTIONS.includes(sid)){toast(t('onb_locked'));return}
    let arr=p.sections.slice();
    if(arr.includes(sid))arr=arr.filter(x=>x!==sid);else arr.push(sid);
    MANDATORY_SECTIONS.forEach(s=>{if(!arr.includes(s))arr.push(s)});
    arr.sort((a,b)=>a-b);
    if(!arr.length){toast(t('keep_one_section'));return}
    p.sections=arr;save();b.classList.toggle('on',arr.includes(sid));buildDrawer();
    if(CURRENT_SECTION!==8&&!arr.includes(CURRENT_SECTION))navigate('home');
  });

  const resetBtn=root.querySelector('#resetBtn');
  if(resetBtn)resetBtn.onclick=()=>confirmBox(t('reset_all'),t('reset_confirm'),()=>{
    DB.tasks=[];DB.habits=[];DB.notes=[];DB.water={};DB.sleep={};DB.exercises=[];DB.weights=[];DB.finance={entries:[]};DB.fitlife={plans:[],todayDone:{}};DB.study={tasks:[]};DB.html={projects:[],currentCode:{html:'',css:'',js:''},currentName:'Project'};DB.pdfs=[];DB.goals=[];DB.levels={};
    save();toast(t('reset_done'));navigate('home');
  });

  const redoOnb=root.querySelector('#redoOnb');
  if(redoOnb)redoOnb.onclick=()=>confirmBox(t('redo_onb'),t('redo_onb_confirm'),()=>{DB.preferences.onboardingDone=false;DB.preferences.role=null;save();startOnboarding()});
  
  const shareFromAbout=root.querySelector('#shareFromAbout');
  if(shareFromAbout)shareFromAbout.onclick=shareApp;

  const summaryCard=root.querySelector('#levelsSummaryCard');
  if(summaryCard){summaryCard.onclick=()=>{
    openSettingGroup='levels';
    const grp=root.querySelector('.setting-group[data-group="levels"]');
    if(grp){
      root.querySelectorAll('.setting-group').forEach(g=>g.classList.remove('open'));
      grp.classList.add('open');
      try{grp.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
    }
  };summaryCard.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();summaryCard.click()}}}

  const levelsContent=root.querySelector('#levelsContent');
  if(levelsContent){
    const sections=[1,2,3,5];let html='';
    sections.forEach(sid=>{
      const pts=getSectionPoints(sid);const lvl=getLevel(pts);
      const nextThreshold=LEVEL_THRESHOLDS[lvl]||LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length-1];
      const currentThreshold=LEVEL_THRESHOLDS[lvl-1]||0;
      const progress=nextThreshold>currentThreshold?Math.round(((pts-currentThreshold)/(nextThreshold-currentThreshold))*100):100;
      const emoji=BADGE_EMOJIS[sid]||'🏅';
      html+=`<div class="section-lvl-card"><div class="slc-head"><div class="slc-title">${emoji} ${t('sec'+sid)}</div><div class="slc-lvl">${t('level')} ${lvl}</div></div><div class="slc-desc">${t('points')}: ${pts} / ${nextThreshold}</div><div class="progress"><div style="width:${progress}%"></div></div><div class="badge-grid">${Array.from({length:15},(_,i)=>{const l=i+1;const unlocked=l<=lvl;return`<div class="badge-item ${unlocked?'unlocked':''}"><span class="b-icon">${unlocked?emoji:'🔒'}</span><span class="b-name">${t('level')} ${l}</span></div>`}).join('')}</div></div>`;
    });
    levelsContent.innerHTML=html;
  }

  const exportBackupBtn=root.querySelector('#exportBackupBtn');
  if(exportBackupBtn)exportBackupBtn.onclick=()=>{
    try{
      const data=JSON.stringify(DB,null,2);
      const blob=new Blob([data],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='mylife_backup_'+todayKey()+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);toast(t('backup_exported'));
    }catch(e){console.warn('export error:',e);toast(t('backup_error'))}
  };
  
  const importBackupBtn=root.querySelector('#importBackupBtn');
  const backupFileInput=root.querySelector('#backupFileInput');
  if(importBackupBtn&&backupFileInput){
    importBackupBtn.onclick=()=>backupFileInput.click();
    backupFileInput.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(!data||typeof data!=='object')throw new Error('bad');
          confirmBox(t('backup_import'),t('backup_import_desc'),()=>{
            Object.keys(data).forEach(k=>{if(data[k]!==undefined)DB[k]=data[k]});
            if(!Array.isArray(DB.goals))DB.goals=[];
            if(!DB.levels||typeof DB.levels!=='object')DB.levels={};
            save();
            if(DB.auth&&DB.auth.isLoggedIn&&DB.auth.uid&&typeof firebase!=='undefined'&&firebase.firestore){
              try{firebase.firestore().collection('users').doc(DB.auth.uid).set(DB,{merge:true}).catch(()=>{})}catch(e){}
            }
            toast(t('backup_imported'));navigate('settings');
          });
        }catch(err){toast(t('backup_error'))}
      };
      reader.readAsText(file);
    };
  }

  const setDarkAuto=root.querySelector('#setDarkAuto');
  if(setDarkAuto)setDarkAuto.onchange=e=>{
    if(e.target.checked){
      localStorage.setItem('life_organizer_dark_auto','true');
      const mq=window.matchMedia('(prefers-color-scheme: dark)');
      applyTheme(mq.matches);
      if(window._darkAutoListener){try{window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change',window._darkAutoListener)}catch(e){}}
      window._darkAutoListener=e2=>applyTheme(e2.matches);
      mq.addEventListener('change',window._darkAutoListener);
    }else{
      localStorage.setItem('life_organizer_dark_auto','false');
      if(window._darkAutoListener){try{window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change',window._darkAutoListener)}catch(e){}window._darkAutoListener=null}
    }
  };
};

routes['health-dashboard']=function(root){
  const tk=todayKey(),cups=DB.water[tk]||0,goal=DB.waterGoal||8;
  const wp=Math.min(100,Math.round(cups/goal*100));
  const sleepH=DB.sleep[tk]||0;
  const todayEx=DB.exercises.filter(e=>e.date===tk);
  const todayMin=todayEx.reduce((a,b)=>a+(b.minutes||0),0);
  const lastW=DB.weights.length?DB.weights[0]:null;
  root.innerHTML=`<h2 class="page-title">${arDate(new Date())}</h2>
<div class="card"><div class="row" style="justify-content:space-between"><div><div style="font-size:15px;font-weight:700">${t('water')}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${cups} ${t('of')} ${goal}</div></div><div style="font-size:24px;font-weight:800;color:var(--primary)">${wp}%</div></div><div class="progress"><div style="width:${wp}%"></div></div></div>
<div class="grid"><div class="stat"><div class="num">${sleepH?sleepH+t('hour'):'—'}</div><div class="lbl">${t('sleep')}</div></div><div class="stat"><div class="num">${todayMin}${t('min')}</div><div class="lbl">${t('exercise')}</div></div><div class="stat"><div class="num">${todayEx.length}</div><div class="lbl">${t('exercise')}</div></div><div class="stat"><div class="num">${lastW?lastW.kg+t('kg'):'—'}</div><div class="lbl">${t('last_weight')}</div></div></div>
<button class="btn full" id="gw" style="margin-bottom:10px">${t('water_cups')}</button>
<button class="btn ghost full" id="gs" style="margin-bottom:10px">${t('sleep')}</button>
<button class="btn ghost full" id="ge" style="margin-bottom:10px">${t('exercise')}</button>
<button class="btn ghost full" id="gx" style="margin-bottom:10px">${t('exercise_library')}</button>
<button class="btn full" id="gf" style="margin-bottom:14px;background:linear-gradient(135deg,#f39c12,#e74c3c)">💪 ${t('fitlife')} Pro</button>
${tipsCardHTML(2)}`;
  const gw=root.querySelector('#gw');if(gw)gw.onclick=()=>{DB.water[tk]=(DB.water[tk]||0)+1;save();navigate('health-dashboard')};
  const gs=root.querySelector('#gs');if(gs)gs.onclick=()=>navigate('health-sleep');
  const ge=root.querySelector('#ge');if(ge)ge.onclick=()=>navigate('health-exercise');
  const gx=root.querySelector('#gx');if(gx)gx.onclick=()=>navigate('health-exdb');
  const gf=root.querySelector('#gf');if(gf)gf.onclick=()=>navigate('health-fitlife');
};

routes['health-water']=function(root){
  const tk=todayKey();
  root.innerHTML=`<h2 class="page-title">${t('record_water')}</h2>
<div class="card" style="text-align:center"><div style="font-size:42px;font-weight:800;color:var(--primary)">${DB.water[tk]||0}<span style="font-size:20px;color:var(--muted)">/${DB.waterGoal}</span></div></div>
<div class="card"><div class="section-title" style="margin:0 0 6px">${t('cup_press')}</div><div class="cups" id="cups"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><span>${t('target')}</span><div class="row" style="gap:6px"><button class="btn ghost small" id="mn">−</button><span style="font-size:16px;font-weight:800">${DB.waterGoal}</span><button class="btn ghost small" id="pl">+</button></div></div></div>`;
  function dC(){const c=root.querySelector('#cups');const cur=DB.water[tk]||0;c.innerHTML=Array.from({length:DB.waterGoal},(_,i)=>`<div class="cup ${i<cur?'filled':''}" data-i="${i}">💧</div>`).join('');c.querySelectorAll('.cup').forEach(el=>{el.onclick=()=>{const i=+el.dataset.i;const cur=DB.water[tk]||0;DB.water[tk]=(i<cur)?i:i+1;save();navigate('health-water')}})}
  dC();

function renderMyPlans(content){const plans=DB.fitlife.plans||[];const DAYS=getDays();content.innerHTML=`
<div class="card" style="text-align:center"><div style="font-size:14px;color:var(--muted)">${t('total_plans')}</div><div style="font-size:32px;font-weight:800;color:var(--primary);margin-top:6px">${plans.length}</div></div>

  const np=content.querySelector('#newPlanBtn');if(np)np.onclick=()=>openPlanEditor(null);
  content.querySelectorAll('.plan-card').forEach(card=>{const id=card.dataset.id;card.querySelectorAll('[data-act]').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const act=btn.dataset.act;const plan=DB.fitlife.plans.find(p=>p.id===id);if(!plan)return;if(act==='toggle'){plan.active=!plan.active;save();renderMyPlans(content)}else if(act==='edit')openPlanEditor(plan);else if(act==='delete')confirmBox(t('delete'),`${t('delete')} "${plan.name}"?`,()=>{DB.fitlife.plans=DB.fitlife.plans.filter(p=>p.id!==id);save();renderMyPlans(content)})}})})}

function openPlanEditor(plan){
  if(plan){planDraft=JSON.parse(JSON.stringify(plan))}else{planDraft={id:uid(),name:'',active:true,days:{saturday:[],sunday:[],monday:[],tuesday:[],wednesday:[],thursday:[],friday:[]},startDate:Date.now(),created:Date.now()}}
  const DAYS=getDays();DAYS.forEach(d=>{if(!planDraft.days)planDraft.days={};if(!Array.isArray(planDraft.days[d.key]))planDraft.days[d.key]=[]});
  fitlifeSelectedDay='saturday';planEditorCat='chest';
  const modal=document.getElementById('planModal');
  const titleEl=document.getElementById('planModalTitle');if(titleEl)titleEl.textContent=plan?t('edit_plan'):t('new_plan');
  const lblEl=document.getElementById('planModalLbl');if(lblEl)lblEl.textContent=t('plan_name');
  const nameInp=document.getElementById('planName');if(nameInp)nameInp.value=planDraft.name||'';
  if(modal)modal.style.display='flex';
  renderDaysGrid();renderDayEditor();
  const cancel=document.getElementById('planCancel');if(cancel)cancel.onclick=()=>{if(modal)modal.style.display='none';planDraft=null};
  const saveBtn=document.getElementById('planSave');
  if(saveBtn)saveBtn.onclick=()=>{if(!planDraft)return;const name=document.getElementById('planName').value.trim();if(!name){toast(t('plan_name_required'));return}planDraft.name=name;let totalEx=0;DAYS.forEach(d=>{totalEx+=(planDraft.days[d.key]||[]).length});if(totalEx===0){toast(t('add_one_exercise'));return}const end=new Date(planDraft.startDate||Date.now());end.setDate(end.getDate()+7);planDraft.endDate=end.getTime();planDraft.updated=Date.now();const idx=DB.fitlife.plans.findIndex(p=>p.id===planDraft.id);if(idx>=0)DB.fitlife.plans[idx]=planDraft;else DB.fitlife.plans.unshift(planDraft);save();if(modal)modal.style.display='none';planDraft=null;toast(t('plan_saved'));const content=document.getElementById('flContent');if(content&&fitlifeTab==='myPlans')renderMyPlans(content)};
}

function renderDaysGrid(){const grid=document.getElementById('planDaysGrid');if(!grid||!planDraft)return;const DAYS=getDays();grid.innerHTML=DAYS.map(d=>{const count=(planDraft.days[d.key]||[]).length;const cls=[count?'has':'',fitlifeSelectedDay===d.key?'selected':''].filter(Boolean).join(' ');return`<button class="day-chip ${cls}" data-day="${d.key}"><span class="day-icon">${d.icon}</span><span class="day-label">${d.label}</span><span class="day-count">${count}</span></button>`}).join('');grid.querySelectorAll('.day-chip').forEach(btn=>btn.onclick=()=>{fitlifeSelectedDay=btn.dataset.day;renderDaysGrid();renderDayEditor()})}

function renderDayEditor(){const area=document.getElementById('planDayEditor');if(!area||!planDraft)return;const DAYS=getDays();const dayObj=DAYS.find(d=>d.key===fitlifeSelectedDay);const exercises=planDraft.days[fitlifeSelectedDay]||[];const catExercises=getExercisesByCat(planEditorCat);

<button class="btn full" id="addExBtn">${t('add')}</button>
${exercises.length?`<div class="exercise-list-day">${exercises.map((e,i)=>`<div class="exercise-item-plan"><div style="flex:1"><div class="name">${esc(e.name)}</div><div class="meta">${[e.sets?e.sets+' '+t('sets'):'',e.reps?e.reps+' '+t('reps'):''].filter(Boolean).join(' • ')}</div></div><button class="del-btn" data-idx="${i}">✕</button></div>`).join('')}</div>`:''}`;
  area.querySelectorAll('.cat-chip').forEach(chip=>{chip.onclick=()=>{planEditorCat=chip.dataset.cat;renderDayEditor()}});
  const addExBtn=area.querySelector('#addExBtn');
  if(addExBtn)addExBtn.onclick=()=>{if(!planDraft)return;const name=area.querySelector('#exSelect').value;const sets=area.querySelector('#exSets').value.trim();const reps=area.querySelector('#exReps').value.trim();const rest=area.querySelector('#exRest').value.trim();if(!Array.isArray(planDraft.days[fitlifeSelectedDay]))planDraft.days[fitlifeSelectedDay]=[];planDraft.days[fitlifeSelectedDay].push({name,sets,reps,rest,done:false});renderDaysGrid();renderDayEditor();toast(t('exercise_added'))};
  area.querySelectorAll('.del-btn').forEach(btn=>btn.onclick=()=>{planDraft.days[fitlifeSelectedDay].splice(+btn.dataset.idx,1);renderDaysGrid();renderDayEditor()})}

function getTodayDayKey(){const i=new Date().getDay();return['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][i]}

function renderTodayPlan(content){const dayKey=getTodayDayKey();const DAYS=getDays();const dayObj=DAYS.find(d=>d.key===dayKey);const now=new Date();const timeStr=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const dateStr=arDate(now);const todayK=todayKey();const activePlans=DB.fitlife.plans.filter(p=>p.active);const todayExercises=[];
  activePlans.forEach(plan=>{const start=new Date(plan.startDate||plan.created);const end=new Date(plan.endDate||(start.getTime()+7*24*3600*1000));if(now<start||now>end)return;(plan.days[dayKey]||[]).forEach((ex,idx)=>{const dk=`${plan.id}_${todayK}_${dayKey}_${idx}`;todayExercises.push({planName:plan.name,ex,dk,done:!!DB.fitlife.todayDone[dk]})})});
  content.innerHTML=`<div class="today-header"><div class="td-day">${dayObj.icon} ${dayObj.label}</div><div class="td-date">${dateStr}</div><div class="td-time">🕐 ${['ar','fa','ur'].includes(LANG)?toEn(timeStr):timeStr}</div></div>
${todayExercises.length?`<div>${todayExercises.map(te=>`<div class="today-exercise ${te.done?'done':''}" data-key="${te.dk}"><div class="te-check" data-act="toggle">✓</div><div style="flex:1"><div class="te-name">${esc(te.ex.name)}</div><div class="te-meta">${esc(te.planName)}</div></div></div>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:30px"><div style="font-size:48px">📅</div><div style="color:var(--muted);font-size:14px">${t('no_active_today')}</div></div>`}`;
  content.querySelectorAll('.today-exercise').forEach(el=>{const key=el.dataset.key;const tog=el.querySelector('[data-act="toggle"]');if(tog)tog.onclick=()=>{DB.fitlife.todayDone[key]=!DB.fitlife.todayDone[key];save();renderTodayPlan(content)}})}

function renderProgress(content){const DAYS=getDays();const plans=DB.fitlife.plans||[];let allStats=[];plans.forEach(p=>{const total=DAYS.reduce((s,d)=>s+((p.days[d.key]||[]).length),0);let done=0;Object.keys(DB.fitlife.todayDone).forEach(k=>{if(k.startsWith(p.id+'_')&&DB.fitlife.todayDone[k])done++});const pct=total?Math.min(100,Math.round(done/total*100)):0;allStats.push({plan:p,total,done,pct})});
  const grandTotal=allStats.reduce((s,x)=>s+x.total,0);const grandDone=allStats.reduce((s,x)=>s+x.done,0);const grandPct=grandTotal?Math.min(100,Math.round(grandDone/grandTotal*100)):0;
  content.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:14px;color:var(--muted)">${t('overall_progress')}</div><div style="font-size:48px;font-weight:900;color:var(--primary);margin:8px 0">${grandPct}%</div><div style="font-size:13px;color:var(--muted)">${grandDone} ${t('of')} ${grandTotal}</div></div>
${allStats.length?allStats.map(s=>`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div style="font-weight:800;font-size:15px">${s.plan.active?'✅':'⏸️'} ${esc(s.plan.name)}</div><div style="font-size:18px;font-weight:800;color:var(--primary)">${s.pct}%</div></div><div class="progress"><div style="width:${s.pct}%"></div></div></div>`).join(''):`<div class="card" style="text-align:center;padding:30px">${t('no_plans')}</div>`}`}

ll>${d.lbl}</small></div>`}).join('')}</div><div class="pro-report-rings"><div class="pro-ring" style="--pct:${Math.min(100,Math.round(T.tasksDone/Math.max(1,(DB.tasks||[]).length)*100))}%;--ring:#54d7ff"><span>${Math.min(100,Math.round(T.tasksDone/Math.max(1,(DB.tasks||[]).length)*100))}%</span><small>${LANG==='ar'?'المهام':'Tasks'}</small></div><div class="pro-ring" style="--pct:${Math.min(100,Math.round(T.habitsDone/Math.max(1,(DB.habits||[]).length*7)*100))}%;--ring:#b99cff"><span>${Math.min(100,Math.round(T.habitsDone/Math.max(1,(DB.habits||[]).length*7)*100))}%</span><small>${LANG==='ar'?'العادات':'Habits'}</small></div><div class="pro-ring" style="--pct:${Math.min(100,Math.round(T.exerciseMin/210*100))}%;--ring:#54e0ae"><span>${Math.min(100,Math.round(T.exerciseMin/210*100))}%</span><small>${LANG==='ar'?'الرياضة':'Exercise'}</small></div></div><div class="pro-report-foot">MY LIFE PRO · ${LANG==='ar'?'لوحة مؤشرات شخصية':'PERSONAL ANALYTICS'} · ${new Date().getFullYear()}</div></div>`:'';

      soft:{type:'sine',key:430,fn:520,eq:660,volume:.028,duration:.075},
      digital:{type:'square',key:740,fn:980,eq:1240,volume:.018,duration:.035},
      wood:{type:'triangle',key:330,fn:410,eq:520,volume:.04,duration:.06}

  }catch(e){}
}
// Delete key: tap once to remove one character; hold to erase continuously.
function bindCalcLongDelete(button, onDelete){
  if(!button)return;
  let delayTimer=null, repeatTimer=null, held=false, didRepeat=false;
  const stop=()=>{if(delayTimer!==null){clearTimeout(delayTimer);delayTimer=null}if(repeatTimer!==null){clearInterval(repeatTimer);repeatTimer=null}};
  button.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    held=true;didRepeat=false;
    delayTimer=setTimeout(()=>{
      if(!held)return;
      didRepeat=true;onDelete();
      repeatTimer=setInterval(()=>{if(held)onDelete()},75);
    },420);
  });
  const release=()=>{
    if(!held)return;
    held=false;stop();
    if(!didRepeat)onDelete();
  };
  button.addEventListener('pointerup',release);
  button.addEventListener('pointercancel',()=>{held=false;stop()});
  button.addEventListener('lostpointercapture',()=>{held=false;stop()});
  button.addEventListener('contextmenu',e=>e.preventDefault());
}

function safeEval(s){

}

function playStudyTimerAlarm(){try{const kind=(DB.preferences&&DB.preferences.timerSound)||'chime',ctx=new (window.AudioContext||window.webkitAudioContext)();const seq={chime:[[660,0,.24],[880,.28,.34],[1046,.66,.45]],digital:[[880,0,.12],[880,.2,.12],[660,.4,.2],[990,.68,.28]],bell:[[523,0,.5],[659,.55,.5],[784,1.1,.65]],pulse:[[740,0,.14],[740,.28,.14],[740,.56,.14],[988,.86,.4]]}[kind]||[[660,0,.24],[880,.28,.34],[1046,.66,.45]];seq.forEach(([f,delay,dur])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='digital'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+dur);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.03)});setTimeout(()=>ctx.close().catch(()=>{}),2500)}catch(e){}}
function playStudyTimerRunSound(){try{const kind=(DB.preferences&&DB.preferences.timerRunSound)||'off';if(kind==='off')return;const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='digital'?'square':'sine';o.frequency.value=kind==='tick'?1150:kind==='digital'?740:520;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(kind==='soft'?.025:.045,ctx.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.065);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.075);setTimeout(()=>ctx.close().catch(()=>{}),150)}catch(e){}}

'}</option><option value="digital" ${DB.preferences.timerSound==='digital'?'selected':''}>${LANG==='ar'?'2. رقمي':'2. Digital'}</option><option value="bell" ${DB.preferences.timerSound==='bell'?'selected':''}>${LANG==='ar'?'3. جرس':'3. Bell'}</option><option value="pulse" ${DB.preferences.timerSound==='pulse'?'selected':''}>${LANG==='ar'?'4. نبضات':'4. Pulses'}</option></select><label class="field-lbl" for="timerRunSoundSelect" style="margin-top:12px">🎵 ${LANG==='ar'?'الصوت أثناء تشغيل المؤقت':'Sound while timer is running'}</label><select class="input" id="timerRunSoundSelect"><option value="off" ${(DB.preferences.timerRunSound||'off')==='off'?'selected':''}>${LANG==='ar'?'1. بدون صوت':'1. Silent'}</option><option value="tick" ${DB.preferences.timerRunSound==='tick'?'selected':''}>${LANG==='ar'?'2. تكة ساعة':'2. Clock tick'}</option><option value="digital" ${DB.preferences.timerRunSound==='digital'?'selected':''}>${LANG==='ar'?'3. نبضة رقمية':'3. Digital pulse'}</option><option value="soft" ${DB.preferences.timerRunSound==='soft'?'selected':''}>${LANG==='ar'?'4. نقرة هادئة':'4. Soft click'}</option></select><button type="button" class="btn ghost full" id="previewRunSound" style="margin-top:8px">▶ ${LANG==='ar'?'تجربة صوت التشغيل':'Preview running sound'}</button><button type="button" class="btn ghost full" id="previewTimerSound" style="margin-top:10px">▶ ${LANG==='ar'?'تجربة الصوت':'Preview sound'}</button></div><div class="timer-buttons"><button class="btn-start" id="bs">▶ ${t('start')}</button><button class="btn-pause" id="bp">⏸ ${t('pause')}</button><button class="btn-reset" id="br">🔄 ${t('reset')}</button></div><div class="tips-inline"><span>💡</span><span id="sTip">${getStudyTips()[0]}</span></div></div></div>`;

      else{const sc=parseFloat(root.querySelector('#sc').value);const pc=parseFloat(root.querySelector('#pc').value);if(isNaN(sc)||isNaN(pc)||pc<=0||pc>100||sc<0){r.textContent=t('invalid_value');r.className='result warning';return}const tt=(sc*100)/pc;r.textContent=`${L?'المجموع الكلي':'Total'}: ${tt.toFixed(2)}`;r.className='result success'}

function exportProject(){
  try{
    const code=DB.html&&DB.html.currentCode?DB.html.currentCode:{html:"",css:"",js:""};
    const name=(DB.html&&DB.html.currentName?DB.html.currentName:"MyLife-Project").trim().replace(/[\\/:*?"<>|]+/g,"-")||"MyLife-Project";
    const safeJs=String(code.js||"").replace(/<\/script/gi,"<\\/script");
    const documentText='<!DOCTYPE html>\n<html lang="'+(LANG||"ar")+'" dir="'+((LANG_META[LANG]&&LANG_META[LANG].dir)||"rtl")+'">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(name)+'</title>\n<style>\n'+(code.css||"")+'\n</style>\n</head>\n<body>\n'+(code.html||"")+'\n<script>\n'+safeJs+'\n<\/script>\n</body>\n</html>';
    const blob=new Blob([documentText],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name+".html";a.style.display="none";document.body.appendChild(a);a.click();a.remove();

const PDF_DB_NAME='life_organizer_pdfs_v1';let pdfDB=null;
function openPdfDB(){return new Promise((res,rej)=>{if(pdfDB)return res(pdfDB);const req=indexedDB.open(PDF_DB_NAME,1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};req.onsuccess=e=>{pdfDB=e.target.result;res(pdfDB)};req.onerror=()=>rej(req.error)})}
async function savePdfFile(id,name,data){const db=await openPdfDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id,name,data,created:Date.now()});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getPdfFile(id){const db=await openPdfDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function deletePdfFile(id){const db=await openPdfDB();return new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

async function openPdf(id){const meta=DB.pdfs.find(p=>p.id===id);if(!meta){toast(t('file_missing'));return}const area=document.getElementById('pdfArea');if(!area)return;
  area.innerHTML=`<div class="pdf-viewer" id="pdfViewer"><div class="pdf-loading">${t('loading_pdf')}</div></div><div class="pdf-controls" style="margin-top:12px"><button id="pdfPrev">${t('prev')}</button><div class="pg-indicator" id="pdfPg">- / -</div><button id="pdfNext">${t('next_page')}</button></div><div class="pdf-controls"><button id="pdfZoomOut">${t('zoom_out')}</button><button id="pdfZoomIn">${t('zoom_in')}</button><button id="pdfFit">${t('fit')}</button></div>`;
  try{const fileRec=await getPdfFile(id);if(!fileRec){toast(t('file_not_found'));return}const arrayBuf=await fileRec.data.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;currentPdf=meta;currentPdfDoc=pdf;currentPdfPage=meta.lastPage&&meta.lastPage<=pdf.numPages?meta.lastPage:1;currentPdfScale=1.2;await renderPdfPage();
    document.getElementById('pdfPrev').onclick=()=>{if(currentPdfPage>1){currentPdfPage--;renderPdfPage()}};
    document.getElementById('pdfNext').onclick=()=>{if(currentPdfPage<currentPdfDoc.numPages){currentPdfPage++;renderPdfPage()}};
    document.getElementById('pdfZoomIn').onclick=()=>{currentPdfScale=Math.min(3,currentPdfScale+0.2);renderPdfPage()};
    document.getElementById('pdfZoomOut').onclick=()=>{currentPdfScale=Math.max(0.5,currentPdfScale-0.2);renderPdfPage()};

  }catch(err){console.error(err);document.getElementById('pdfViewer').innerHTML='<div class="pdf-loading">'+t('pdf_failed')+'</div>'}}

async function renderPdfPage(){if(!currentPdfDoc)return;const viewer=document.getElementById('pdfViewer');if(!viewer)return;const page=await currentPdfDoc.getPage(currentPdfPage);const viewport=page.getViewport({scale:currentPdfScale});const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');canvas.width=viewport.width;canvas.height=viewport.height;canvas.className='pdf-page';await page.render({canvasContext:ctx,viewport}).promise;viewer.innerHTML='';viewer.appendChild(canvas);const pgEl=document.getElementById('pdfPg');if(pgEl)pgEl.textContent=`${currentPdfPage} / ${currentPdfDoc.numPages}`;if(currentPdf){const m=DB.pdfs.find(p=>p.id===currentPdf.id);if(m){m.lastPage=currentPdfPage;save()}}}

/* ==================== AUTH ==================== */
let authMode = 'login';
function setupAuth() {
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const authName = document.getElementById('authName');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authError = document.getElementById('authError');
  const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
  const nameField = document.getElementById('nameField');
  
  if (!tabLogin || !authSubmitBtn) return;

  function updateAuthTexts() {
    if (tabLogin) tabLogin.textContent = t('login_tab_login');
    if (tabSignup) tabSignup.textContent = t('login_tab_signup');
    if (authSubmitBtn) authSubmitBtn.textContent = authMode === 'signup' ? t('login_submit_signup') : t('login_submit_login');
    if (forgotPasswordBtn) forgotPasswordBtn.textContent = t('login_forgot');
  }
  updateAuthTexts();

  // Password recovery flow for the standalone HTML / Android WebView.
  const resetScreen = document.getElementById('resetScreen');
  const resetEmail = document.getElementById('resetEmail');
  const resetError = document.getElementById('resetError');
  const sendResetBtn = document.getElementById('sendResetBtn');
  const backToLoginBtn = document.getElementById('backToLoginBtn');

  if (forgotPasswordBtn) {
    forgotPasswordBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!resetScreen) { if (authError) authError.textContent = 'تعذر فتح شاشة استعادة كلمة المرور.'; return; }
      if (resetEmail && authEmail && authEmail.value.trim()) resetEmail.value = authEmail.value.trim();
      if (authError) authError.textContent = '';
      if (resetError) resetError.textContent = '';
      const loginScreen = document.getElementById('loginScreen');
      if (loginScreen) { loginScreen.style.display = 'none'; loginScreen.classList.add('hidden'); }
      resetScreen.style.display = 'flex';
      resetScreen.classList.remove('hidden');
    });
  }

  if (backToLoginBtn) {
    backToLoginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (resetScreen) { resetScreen.style.display = 'none'; resetScreen.classList.add('hidden'); }
      const loginScreen = document.getElementById('loginScreen');
      if (loginScreen) { loginScreen.style.display = 'flex'; loginScreen.classList.remove('hidden'); }
      if (resetError) resetError.textContent = '';
    });
  }

  if (sendResetBtn) {
    sendResetBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = resetEmail ? resetEmail.value.trim() : '';
      if (resetError) resetError.textContent = '';
      if (!email) { if (resetError) resetError.textContent = 'أدخل بريدك الإلكتروني أولاً.'; return; }
      if (typeof firebase === 'undefined' || !firebase.auth || !firebase.apps || !firebase.apps.length) {
        if (resetError) resetError.textContent = 'خدمة Firebase غير متاحة. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.';
        return;
      }
      sendResetBtn.disabled = true;
      const originalText = sendResetBtn.textContent;
      sendResetBtn.textContent = 'جارٍ إرسال الرابط...';
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        if (resetError) { resetError.style.color = 'var(--ok)'; resetError.textContent = 'إذا كان الحساب مسجلاً بهذا البريد، فستصلك رسالة لإعادة تعيين كلمة المرور. تحقق من البريد الوارد ومجلد الرسائل غير المرغوب فيها.'; }
      } catch (err) {
        console.error('Password reset error:', err && (err.code || err.message), err);
        const messages = {
          'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
          'auth/user-not-found': 'لا يوجد حساب مرتبط بهذا البريد الإلكتروني.',
          'auth/too-many-requests': 'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.',
          'auth/network-request-failed': 'تعذر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.',
          'auth/operation-not-allowed': 'إعادة تعيين كلمة المرور غير متاحة في إعدادات Firebase.'
        };
        if (resetError) { resetError.style.color = 'var(--danger)'; resetError.textContent = messages[err && err.code] || ('تعذر إرسال الرابط' + (err && err.code ? ' (' + err.code + ')' : '') + '. تحقق من إعدادات Firebase.'); }
      } finally {
        sendResetBtn.disabled = false;
        sendResetBtn.textContent = originalText || '📩 إرسال رابط إعادة التعيين';
      }
    });
  }
  
  tabLogin.addEventListener('click', () => { authMode = 'login'; tabLogin.classList.add('active'); tabSignup.classList.remove('active'); if (nameField) nameField.style.display = 'none'; authSubmitBtn.textContent = t('login_submit_login'); authError.textContent = ''; });
  tabSignup.addEventListener('click', () => { authMode = 'signup'; tabSignup.classList.add('active'); tabLogin.classList.remove('active'); if (nameField) nameField.style.display = 'block'; authSubmitBtn.textContent = t('login_submit_signup'); authError.textContent = ''; });
  
  authSubmitBtn.addEventListener('click', async () => {
    if (typeof firebase === 'undefined' || !firebase.auth) { authError.textContent = '⚠️ Firebase غير متاح. تحقق من اتصال الإنترنت.'; return; }

    const email = authEmail.value.trim();
    const password = authPassword.value;
    const name = authName ? authName.value.trim() : '';

    if (!email || !password) { authError.textContent = t('login_error_empty'); return; }
    if (authMode === 'signup' && !name) { authError.textContent = t('login_error_name'); return; }
    if (password.length < 6) { authError.textContent = t('login_error_pass_length'); return; }

    authError.textContent = '';
    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = t('login_processing');
    toast(t('login_processing'));

    let timedOut = false;
    let timeoutId;
    try {
      if (!firebase.apps || !firebase.apps.length) {
        throw new Error('Firebase لم يتم تهيئته. تحقق من إعدادات Firebase واتصال الإنترنت.');
      }
      const auth = firebase.auth();
      // لا نترك الزر عالقاً إلى ما لا نهاية إذا لم يستجب WebView/Firebase.
      const authRequest = (async () => {
        try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }
        catch (persistenceError) {
          // بعض WebView لا تدعم التخزين المحلي؛ تابع جلسة المصادقة بدلاً من تعليق الدخول.
          console.warn('Firebase persistence unavailable:', persistenceError);
        }
        if (authMode === 'signup') {
          const credential = await auth.createUserWithEmailAndPassword(email, password);
          if (credential.user && name) {
            try { await credential.user.updateProfile({ displayName: name }); }
            catch (profileError) { console.warn('Profile name update failed:', profileError); }
          }
          return credential;
        }
        return await auth.signInWithEmailAndPassword(email, password);
      })();

      await Promise.race([
        authRequest,
        new Promise((_, reject) => {
          timeoutId = setTimeout(() => {
            timedOut = true;
            const e = new Error('انتهت مهلة تسجيل الدخول بعد 20 ثانية. تحقق من الإنترنت ومن إعدادات Firebase، خصوصاً Email/Password وAuthorized domains.');
            e.code = 'app/login-timeout';
            reject(e);
          }, 20000);
        })
      ]);
      // مستمع onAuthStateChanged يتولى الانتقال بعد نجاح المصادقة.
    } catch (err) {
      console.error('Firebase Authentication error:', err && (err.code || err.message), err);
      const code = err && err.code ? err.code : '';
      const map = {
        'auth/email-already-in-use': t('login_error_email_in_use'),
        'auth/invalid-email': t('login_error_invalid_email'),
        'auth/weak-password': t('login_error_weak_pass'),
        'auth/user-not-found': t('login_error_user_not_found'),
        'auth/wrong-password': t('login_error_wrong_pass'),
        'auth/invalid-credential': t('login_error_invalid_cred'),
        'auth/too-many-requests': t('login_error_too_many'),
        'auth/network-request-failed': 'تعذر الاتصال بخدمة تسجيل الدخول. تحقق من الإنترنت أو إعدادات الشبكة في AppCreator24.',
        'auth/operation-not-allowed': 'تسجيل الدخول بالبريد وكلمة المرور غير مفعّل في Firebase Console > Authentication > Sign-in method.',
        'auth/unauthorized-domain': 'عنوان التطبيق غير مسموح به في Firebase. راجع Authentication > Settings > Authorized domains.',
        'auth/app-not-authorized': 'هذا التطبيق غير مصرّح له باستخدام مشروع Firebase. تحقق من إعدادات التطبيق ومفتاح API.',
        'auth/invalid-api-key': 'مفتاح Firebase API غير صالح. راجع firebaseConfig.',
        'auth/web-storage-unsupported': 'بيئة التطبيق لا تسمح بتخزين جلسة تسجيل الدخول. تحقق من إعدادات WebView في AppCreator24.',
        'auth/internal-error': 'حدث خطأ داخلي في Firebase. راجع إعدادات المشروع.',
        'app/login-timeout': err.message
      };
      authError.textContent = map[code] || ('فشل تسجيل الدخول' + (code ? ' (' + code + ')' : '') + '. تحقق من البريد وكلمة المرور وإعدادات Firebase ثم أعد المحاولة.');
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = authMode === 'signup' ? t('login_submit_signup') : t('login_submit_login');
    }
  });

  // مستمع المصادقة: لا نخرج مبكراً إذا كان UID محفوظاً بالفعل؛ يجب إظهار التطبيق دائماً.
  firebase.auth().onAuthStateChanged(async (user) => {
    try {
      if (window.__myLifeLoggingOut) return;
      if (!user) {
        // احتفظ بجلسة الضيف المحلية، لكن لا تترك واجهة الحساب القديم ظاهرة
        // إذا أكد Firebase عدم وجود مستخدم مسجل الدخول.
        const isGuestSession = !!(DB.auth && DB.auth.isLoggedIn && !DB.auth.uid);
        if (isGuestSession) return;

        DB.auth = { username: '', email: '', uid: '', isLoggedIn: false };
        try { save(); } catch (saveError) { console.warn('Auth state save failed:', saveError); }

        const appEl = document.querySelector('.app');
        if (appEl) appEl.style.display = 'none';
        const loginScreen = document.getElementById('loginScreen');
        if (loginScreen) {
          loginScreen.style.display = 'flex';
          loginScreen.classList.remove('hidden');
        }
        const resetScreen = document.getElementById('resetScreen');
        if (resetScreen) {
          resetScreen.style.display = 'none';
          resetScreen.classList.add('hidden');
        }
        document.body.classList.add('auth-flow');
        return;
      }

      // Restore this account's cloud data before save() runs; otherwise the
      // first auth callback could upload local/guest data over the account data.
      const accountUid = user.uid || '';
      if (accountUid && typeof firebase !== 'undefined' && firebase.firestore) {
        try {
          const accountSnap = await firebase.firestore().collection('users').doc(accountUid).get();
          if (accountSnap && accountSnap.exists) {
            const cloudData = accountSnap.data() || {};
            const accountFields = ['tasks','habits','notes','water','waterGoal','sleep','exercises','weights','finance','fitlife','study','html','dark','preferences','goals','levels'];
            accountFields.forEach((key) => {
              if (Object.prototype.hasOwnProperty.call(cloudData, key)) DB[key] = cloudData[key];
            });
            // Normalize fields after loading data written by older app versions.
            if (!Array.isArray(DB.tasks)) DB.tasks = [];
            if (!Array.isArray(DB.habits)) DB.habits = [];
            if (!Array.isArray(DB.notes)) DB.notes = [];
            if (!DB.finance || typeof DB.finance !== 'object') DB.finance = { entries: [] };
            if (!Array.isArray(DB.finance.entries)) DB.finance.entries = [];
            if (!DB.preferences || typeof DB.preferences !== 'object') DB.preferences = { ...DEFAULT_PREFS };
            else DB.preferences = { ...DEFAULT_PREFS, ...DB.preferences };
            if (!DB.levels || typeof DB.levels !== 'object') DB.levels = {};
          }
        } catch (cloudLoadError) {
          console.warn('Could not restore cloud data; keeping local data:', cloudLoadError);
        }
      }
      DB.auth = {
        username: user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
        email: user.email || '',
        uid: accountUid,
        isLoggedIn: true
      };
      try { save(); } catch (saveError) { console.warn('Saving login state failed:', saveError); }

      const loginScreen = document.getElementById('loginScreen');
      if (loginScreen) {
        loginScreen.classList.add('hidden');
        loginScreen.style.display = 'none';
      }
      const appEl = document.querySelector('.app');
      if (appEl) appEl.style.display = '';
      document.body.classList.remove('auth-flow');

      // أعطِ WebView لحظة لتحديث DOM ثم اعرض الصفحة الرئيسية، حتى لو كانت الجلسة محفوظة مسبقاً.
      setTimeout(() => {
        try {
          if (!DB.preferences) DB.preferences = { ...DEFAULT_PREFS };
          if (!DB.preferences.onboardingDone) {
            startOnboarding();
          } else {
            const onb = document.getElementById('onboardingScreen');
            if (onb) onb.classList.add('hidden');
            buildDrawer();
            navigate('home');
          }
        } catch (navigationError) {
          console.error('Post-login navigation failed:', navigationError);
          const view = document.getElementById('view');
          if (view) view.innerHTML = '<div class="card" style="text-align:center"><h3>تم تسجيل الدخول بنجاح</h3><p>تعذر فتح الصفحة الرئيسية. أعد فتح التطبيق، وإذا تكرر الخطأ أرسل صورة للشاشة.</p><button class="btn" onclick="try{navigate(\'home\')}catch(e){console.error(e)}">إعادة المحاولة</button></div>';
        }
      }, 150);
    } catch (listenerError) {
      console.error('Firebase auth state handler failed:', listenerError);
      const authError = document.getElementById('authError');
      if (authError) authError.textContent = 'تم الاتصال بالحساب لكن تعذر فتح التطبيق. أغلق التطبيق وافتحه مجددًا.';
      const loginScreen = document.getElementById('loginScreen');
      if (loginScreen) loginScreen.classList.remove('hidden');
      document.body.classList.add('auth-flow');
    }
  });
}

function init(){
  try{console.log('🚀 App v'+APP_VERSION+' starting...');applyLanguage();load();applyTheme(!!DB.dark);applyPreferences();updateDateTime();refreshLoginTexts();refreshOnbTexts();console.log('✅ Basic setup complete')}catch(e){console.error('❌ Init base error:',e)}

  // ✅ الوضع الليلي التلقائي
  if(localStorage.getItem('life_organizer_dark_auto')==='true'){
    try{
      const mq=window.matchMedia('(prefers-color-scheme: dark)');
      applyTheme(mq.matches);
      if(window._darkAutoListener){try{window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change',window._darkAutoListener)}catch(e){}}
      window._darkAutoListener=e=>applyTheme(e.matches);
      mq.addEventListener('change',window._darkAutoListener);
    }catch(e){console.warn('Auto dark init error:',e)}
  }

  try{
    const ls=document.getElementById('loginScreen');
    const skipBtn=document.getElementById('skipBtn');
    if(DB.auth&&DB.auth.isLoggedIn&&ls){ls.classList.add('hidden');document.body.classList.remove('auth-flow')}
    else{document.body.classList.add('auth-flow')}
    if(skipBtn){
      skipBtn.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();
        try{
          // إعادة إظهار واجهة التطبيق بعد تسجيل الخروج، ثم المتابعة كضيف.
          DB.auth={username:'Guest',email:'',uid:'',isLoggedIn:true};
          try{save()}catch(saveError){console.warn('Guest state save failed:',saveError)}
          const appEl=document.querySelector('.app');
          if(appEl){appEl.style.display='';appEl.classList.remove('hidden')}
          if(ls){ls.style.display='none';ls.classList.add('hidden')}
          const resetScreen=document.getElementById('resetScreen');
          if(resetScreen)resetScreen.classList.add('hidden');
          document.body.classList.remove('auth-flow');
          setTimeout(()=>{
            try{afterLogin()}
            catch(routeError){
              console.error('Guest navigation error:',routeError);
              if(appEl)appEl.style.display='';
              const view=document.getElementById('view');
              if(view)view.innerHTML='<div class="card" style="text-align:center;padding:24px">تعذر فتح الصفحة الرئيسية. أعد المحاولة.</div>';
            }
          },100);
        }catch(err){
          console.error('Skip error:',err);
          const appEl=document.querySelector('.app');if(appEl)appEl.style.display='';
          if(ls){ls.style.display='none';ls.classList.add('hidden')}
          document.body.classList.remove('auth-flow');
          try{afterLogin()}catch(finalErr){console.error('Guest fallback error:',finalErr)}
        }
      });
    }
  }catch(e){console.error('❌ Login buttons error:',e)}

  try{setupAuth()}catch(e){console.error('Auth setup error:',e)}

  try{
    const loginSel=document.getElementById('loginLangSelect');
    if(loginSel){loginSel.addEventListener('change',function(e){const newLang=e.target.value;if(!LANGS.includes(newLang))return;localStorage.setItem('life_organizer_lang',newLang);LANG=newLang;applyLanguage();refreshLoginTexts();refreshOnbTexts()})}
  }catch(e){console.warn('Lang select error:',e)}

  try{
    const menuBtn=document.getElementById('menuBtn');if(menuBtn)menuBtn.addEventListener('click',openDrawer);
    const closeBtn=document.getElementById('closeDrawer');if(closeBtn)closeBtn.addEventListener('click',closeDrawer);
    const overlay=document.getElementById('overlay');if(overlay)overlay.addEventListener('click',closeDrawer);
    const themeBtn=document.getElementById('themeBtn');if(themeBtn)themeBtn.addEventListener('click',()=>{applyTheme(!DB.dark);save()});
    const settingsBtn=document.getElementById('settingsBtn');if(settingsBtn)settingsBtn.addEventListener('click',()=>navigate('settings'));
    const shareBtn=document.getElementById('shareBtn');if(shareBtn)shareBtn.addEventListener('click',shareApp);
    // ✅ زر الإنجازات السريع
    const levelsBtn=document.getElementById('levelsBtn');
    if(levelsBtn)levelsBtn.addEventListener('click',()=>{
      openSettingGroup='levels';
      navigate('settings');
      setTimeout(()=>{
        const grp=document.querySelector('.setting-group[data-group="levels"]');
        if(grp){
          document.querySelectorAll('.setting-group').forEach(g=>g.classList.remove('open'));
          grp.classList.add('open');
          try{grp.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
        }
      },200);
    });
    const langBtn=document.getElementById('langBtn');
    if(langBtn){langBtn.addEventListener('click',()=>{try{const newLang=LANG==='ar'?'en':'ar';localStorage.setItem('life_organizer_lang',newLang);LANG=newLang;rebuildUIAfterLangChange();toast(LANG_META[newLang].flag+' '+LANG_META[newLang].name)}catch(e){console.error('Lang btn error:',e)}})}
  }catch(e){console.error('Header buttons error:',e)}

  try{
    const fsClose=document.getElementById('fsCloseBtn');
    if(fsClose)fsClose.addEventListener('click',function(){const fp=document.getElementById('fullscreenPreview');if(fp)fp.classList.remove('show');const fi=document.getElementById('fsIframe');if(fi)fi.srcdoc=''});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){const fp=document.getElementById('fullscreenPreview');if(fp&&fp.classList.contains('show')){fp.classList.remove('show');const fi=document.getElementById('fsIframe');if(fi)fi.srcdoc=''}}});
  }catch(e){}

  if(DB.auth&&DB.auth.isLoggedIn){afterLogin()}
  function afterLogin(){
    try{
      document.body.classList.remove('auth-flow');
      if(!DB.preferences.onboardingDone){startOnboarding()}
      else{const onb=document.getElementById('onboardingScreen');if(onb)onb.classList.add('hidden');buildDrawer();navigate('home')}
      if(typeof window.adsBoot==='function'){try{window.adsBoot()}catch(e){console.warn('adsBoot error:',e)}}
      console.log('✅ After login complete');
    }catch(e){console.error('❌ After login error:',e)}
  }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
