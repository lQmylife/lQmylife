<script id="mylife-quality-profiles-runtime">
(function(){
  const KEY='mylife_quality_profile';
  try{if(!localStorage.getItem('mylife_first_seen'))localStorage.setItem('mylife_first_seen',String(Date.now()));}catch(e){}
  let _usageLast=Date.now(),_usageFraction=0;
  window.__mlFormatDuration=function(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return localStorage.getItem('life_organizer_lang')==='ar'?`${h}س ${m}د ${s}ث`:`${h}h ${m}m ${s}s`;};
  function mlRefreshLiveUsage(){
    try{
      const sec=Math.max(0,Number(localStorage.getItem('mylife_usage_seconds')||0));
      let daily={};try{daily=JSON.parse(localStorage.getItem('mylife_usage_daily_v1')||'{}')}catch(e){}
      const now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);let week=0;
      for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');week+=Number(daily[k]||0)}
      const joined=Number(localStorage.getItem('mylife_first_seen')||Date.now()),days=Math.max(1,Math.floor((Date.now()-joined)/86400000)+1),fmt=window.__mlFormatDuration;
      [['#mlLevelUsageTotal',fmt(sec)],['#mlLevelUsageWeek',fmt(week)],['#mlLevelUsagePoints',String(Math.floor(sec/600)*5)],['#mlLevelUsageDays',String(days)],['#mlAccountTime',fmt(sec)],['#mlAccountDays',days.toLocaleString()]].forEach(([sel,val])=>document.querySelectorAll(sel).forEach(el=>el.textContent=val));
    }catch(e){}
  }
  window.__mlRefreshLiveUsage=mlRefreshLiveUsage;
  window.setInterval(function(){
    const now=Date.now();let elapsed=Math.max(0,Math.min(5,(now-_usageLast)/1000));_usageLast=now;
    if(document.visibilityState==='visible'&&elapsed>0){
      try{
        _usageFraction+=elapsed;const delta=Math.floor(_usageFraction);if(delta>0){_usageFraction-=delta;
          const total=Number(localStorage.getItem('mylife_usage_seconds'))||0,newTotal=total+delta;localStorage.setItem('mylife_usage_seconds',String(newTotal));
          const date=new Date(),key=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');let daily={};try{daily=JSON.parse(localStorage.getItem('mylife_usage_daily_v1')||'{}')}catch(e){}daily[key]=(Number(daily[key])||0)+delta;
          const cutoff=new Date();cutoff.setDate(cutoff.getDate()-400);for(const k of Object.keys(daily)){if(new Date(k+'T00:00:00')<cutoff)delete daily[k]}localStorage.setItem('mylife_usage_daily_v1',JSON.stringify(daily));
          // Credit 5 XP exactly when each new 10-minute active-use milestone is crossed; persist the milestone to prevent duplicate awards.
          const milestones=Math.floor(newTotal/600),credited=Math.max(0,Number(localStorage.getItem('mylife_usage_xp_milestones')||0));
          if(milestones>credited){localStorage.setItem('mylife_usage_xp_milestones',String(milestones));if(typeof window.addXP==='function')window.addXP((milestones-credited)*5,'وقت الاستخدام / active app time');}
          mlRefreshLiveUsage();
        }
      }catch(e){}
    }
  },1000);
  document.addEventListener('visibilitychange',function(){_usageLast=Date.now();_usageFraction=0;});
  window.addEventListener('pageshow',function(){_usageLast=Date.now();mlRefreshLiveUsage();});
  window.getQualityProfile=function(){const q=localStorage.getItem(KEY);return ['mini','simple','pro'].includes(q)?q:'simple'};
  window.qualityLabel=function(q){return ({mini:'My Life Mini',simple:'My Life Simple',pro:'My Life Pro'})[q]||'My Life Simple'};
  window.applyQualityProfile=function(q){if(!['mini','simple','pro'].includes(q))q='simple';document.documentElement.dataset.quality=q;try{localStorage.setItem(KEY,q)}catch(e){} };
  window.getQualityDeviceInfo=function(){const mem=Number(navigator.deviceMemory)||0;const cores=Number(navigator.hardwareConcurrency)||0;let storage='';try{if(navigator.storage&&navigator.storage.estimate){/* Async storage estimates are intentionally not required for the initial decision. */}}catch(e){}return (mem?mem+' GB RAM (reported)':'RAM n/a')+' · '+(cores?cores+' CPU threads (reported)':'CPU threads n/a')+(storage?' · '+storage:'');};
  async function autoSelect(){if(localStorage.getItem('mylife_quality_manual')==='true'&&localStorage.getItem(KEY)) {applyQualityProfile(getQualityProfile());return;}
    let mem=Number(navigator.deviceMemory)||0,cores=Number(navigator.hardwareConcurrency)||0;
    /* Physical storage capacity and CPU speed are not exposed reliably by standard browsers. */
    /* Browsers expose only approximate capability signals, not true RAM/storage or CPU speed. */
    let q='simple';if((mem&&mem<=2)||(cores&&cores<=4))q='mini';else if(mem>=8&&cores>=8)q='pro';
    applyQualityProfile(q);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',autoSelect,{once:true});else autoSelect();
})();
</script>

<script id="mylife-progression-reports-sounds-v2">
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const ar=()=>window.LANG?window.LANG==='ar':document.documentElement.lang==='ar';
const tr=(a,e)=>ar()?a:e;
const safeNum=(k)=>{try{return Math.max(0,Number(localStorage.getItem(k)||0))}catch(e){return 0}};

const KEYS={xp:'mylife_xp_v2',level:'mylife_level_v2',first:'mylife_first_seen',usage:'mylife_usage_seconds',report:'mylife_report_template_v2',color:'mylife_color_level_v2'};
const colorNames=['Ocean','Emerald','Amber','Violet','Rose','Gold','Mint','Indigo','Ruby','Turquoise'];
const colorValues=['#4f7cff','#10b981','#f59e0b','#8b5cf6','#ec4899','#d4a72c','#34d399','#6366f1','#e11d48','#06b6d4'];
const reportNames=['أساسي','منظم','أنيق','أعمال','تحليلي','رسمي','متقدم','مميز','نخبوي','مستقبلي'];

const alarmSounds=[['رنين هادئ','Gentle chime'],['رقمي','Digital'],['جرس','Bell'],['نبضات','Pulses'],['نجمي','Starlight'],['موجة','Wave'],['تنبيه مزدوج','Double alert'],['ساعة قديمة','Clockwork'],['زجاجي','Glass'],['صدى','Echo'],['صاعد','Rising'],['ناعم','Soft'],['فضائي','Cosmic'],['معدني','Metallic'],['مائي','Water'],['تنبيه سريع','Quick alert'],['ثلاث نغمات','Three tones'],['مستقبلي','Future'],['هادئ عميق','Deep calm'],['متدرج','Progressive']];
function getXp(){return safeNum(KEYS.xp)}
function threshold(level){return Math.round(1000*Math.pow(1.2,Math.max(0,level-1)))}
function getLevel(){let xp=getXp(),lvl=0,total=0;for(let i=1;i<=20;i++){let cost=threshold(i);if(xp>=total+cost){total+=cost;lvl=i}else break}return {level:Math.min(20,lvl+1),earned:lvl===20?total:total,xp,next:threshold(Math.min(20,lvl+1))}}
function addXP(n,reason){setNum(KEYS.xp,getXp()+n);renderProgress();if(typeof window.toast==='function')try{window.toast(tr('تمت إضافة '+n+' نقطة: '+reason,n+' points added: '+reason))}catch(e){}}

function addProgressChip(){

}
function buildModal(){if($('#mlProgressModal'))return;const m=document.createElement('div');m.id='mlProgressModal';m.innerHTML=`<div class="mlp-box" role="dialog" aria-modal="true" aria-label="My Life progress"><div class="mlp-head"><h2>🏆 <span data-ml-title>تقدمك ومستواك</span></h2><button class="mlp-close" type="button" aria-label="Close">×</button></div><div id="mlpContent"></div></div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('.mlp-close'))m.classList.remove('show')});}
function openProgress(){buildModal();renderProgress();$('#mlProgressModal').classList.add('show')}
function renderProgress(){const info=getLevel(),chip=$('#mlProgressChip');if(chip){let prev=0;for(let i=1;i<info.level;i++)prev+=threshold(i);const pct=Math.min(100,Math.max(0,Math.floor((info.xp-prev)/threshold(info.level)*100)));chip.innerHTML=`<span class="mlpc-icon">🏆</span><span class="mlpc-main"><strong><span style="display:inline-block;font-size:9px;padding:2px 5px;border-radius:5px;background:var(--bg-soft);margin-inline-end:4px">LV ${info.level}</span>${levelName(info.level)}</strong><small>${info.xp.toLocaleString()} ${tr('نقطة','XP')} · ${pct}% ${tr('للمستوى التالي','to next level')}</small><span class="mlpc-track"><span style="width:${pct}%"></span></span></span><span>›</span>`}
 const box=$('#mlpContent');if(!box)return;let previous=0;for(let i=1;i<info.level;i++)previous+=threshold(i);const needed=threshold(info.level),pct=Math.min(100,Math.floor((info.xp-previous)/needed*100));
 const reportCards=Array.from({length:10},(_,i)=>{let n=i+1,unlocked=n<=earnedReports();return `<button type="button" class="mlp-pick ${currentReport()===n?'active':''}" data-report-template="${n}" ${unlocked?'':'disabled'} style="opacity:${unlocked?1:.48}">${n}. ${ar()?reportNames[i]:reportNamesEn[i]} ${unlocked?'✓':'🔒'}</button>`}).join('');
 const colorCards=Array.from({length:10},(_,i)=>{let unlocked=(i+1)<=Math.max(1,Math.floor((getLevel().level+1)/2));return `<button type="button" class="mlp-pick ${Number(localStorage.getItem(KEYS.color)||1)===i+1?'active':''}" data-color-level="${i+1}" ${unlocked?'':'disabled'} style="opacity:${unlocked?1:.45}">${i+1}. <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colorValues[i]}"></span> ${colorNames[i]} ${unlocked?'':'🔒'}</button>`}).join('');
 box.innerHTML=`<div><strong>${tr('المستوى','Level')} ${info.level}/20 · ${levelName(info.level)}</strong><div class="mlp-progress"><span style="width:${pct}%"></span></div><div class="mlp-muted">${info.xp.toLocaleString()} ${tr('نقطة إجمالية','total points')} · ${pct}% ${tr('نحو المستوى التالي','toward next level')}</div></div>
 <div class="mlp-section ml-usage-level"><strong>⏱️ ${tr('إحصاءات وقت الاستخدام','App time analytics')}</strong><div class="ml-usage-grid"><div><small>${tr('إجمالي الوقت','Total time')}</small><b id="mlLevelUsageTotal">—</b></div><div><small>${tr('هذا الأسبوع','This week')}</small><b id="mlLevelUsageWeek">—</b></div><div><small>${tr('نقاط وقت الاستخدام','Time-earned points')}</small><b id="mlLevelUsagePoints">—</b></div><div><small>${tr('أيام منذ التسجيل','Days since joining')}</small><b id="mlLevelUsageDays">—</b></div></div><p class="mlp-muted">${tr('يُحتسب الوقت عندما يكون التطبيق ظاهرًا ونشطًا في المقدمة.','Time is counted while the app is visible in the foreground.')}</p></div>
 <div class="mlp-section"><strong>${tr('كيف تُحتسب النقاط؟','How points are earned')}</strong><p class="mlp-muted">${tr('تُضاف نقاط النشاط من الوقت المسجل داخل التطبيق، ويمكنك كسب نقاط إضافية من شاشة مكافأة تجريبية. هذه المكافأة ليست إعلانًا تجاريًا حقيقيًا. لا نحتسب النقاط بمجرد الضغط على زر المستوى.','Activity points are credited from tracked app time, with optional points from a simulated reward screen. This is not a real advertisement. Merely opening this panel does not award points.')}</p><div class="mlp-list"><span>⏱️ ${tr('كل 10 دقائق نشطة: 5 نقاط','Every 10 active minutes: 5 points')}</span><span>🏅 ${tr('شارات الأقسام المكتملة قد تضيف نقاطًا عند المزامنة','Section badges may add points when synced')}</span><span>🎁 ${tr('مكافأة قصيرة: 20 نقطة','Short reward: 20 points')}</span><span>📈 ${tr('كل مستوى يتطلب 20% أكثر من السابق','Each level costs 20% more than the previous')}</span></div></div>
 <div class="mlp-section"><strong>${tr('مكافآت اختيارية','Optional rewards')}</strong><div class="mlp-actions"><button class="mlp-action" data-reward="20">+20 ${tr('نقطة','points')}<br><small>20s</small></button><button class="mlp-action" data-reward="50">+50 ${tr('نقطة','points')}<br><small>50s</small></button><button class="mlp-action" data-reward="100">+100 ${tr('نقطة','points')}<br><small>100s</small></button></div><p class="mlp-muted">${tr('تظهر شاشة رعاية تجريبية وتتغير بطاقتها كل 8 ثوانٍ. لا يوجد إعلان حقيقي أو جهة معلنة متصلة.','A simulated sponsor screen rotates every 8 seconds. No real ad network or advertiser is connected.')}</p></div>
 <div class="mlp-section"><strong>${tr('تصميم التقرير','Report design')} · ${earnedReports()}/10 ${tr('متاح','unlocked')}</strong><p class="mlp-muted">${tr('كل مستويين يفتحان تصميمًا جديدًا. يعمل التصميم المختار في Mini وSimple وPro.','Every two levels unlock a new report design. The selected design applies in Mini, Simple and Pro.')}</p><div class="mlp-picks">${reportCards}</div></div>
 <div class="mlp-section"><strong>${tr('مستويات الألوان','Color levels')}</strong><div class="mlp-picks">${colorCards}</div></div>`;
 const updateUsagePanel=()=>{const sec=Math.max(0,Number(localStorage.getItem('mylife_usage_seconds')||0));let daily={};try{daily=JSON.parse(localStorage.getItem('mylife_usage_daily_v1')||'{}')}catch(e){}const now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);let week=0;for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');week+=Number(daily[k]||0)}const joined=Number(localStorage.getItem('mylife_first_seen')||Date.now());const fmt=window.__mlFormatDuration||((v)=>Math.floor(v/3600)+'h '+Math.floor(v%3600/60)+'m '+Math.floor(v%60)+'s');[['#mlLevelUsageTotal',fmt(sec)],['#mlLevelUsageWeek',fmt(week)],['#mlLevelUsagePoints',String(Math.floor(sec/600)*5)],['#mlLevelUsageDays',String(Math.max(1,Math.floor((Date.now()-joined)/86400000)+1))]].forEach(([sel,val])=>{const el=box.querySelector(sel);if(el)el.textContent=val;});};updateUsagePanel();if(window.__mlRefreshLiveUsage)window.__mlRefreshLiveUsage();
 const welcome=getWelcomeState();const welcomeHtml=`<div id="mlWelcomeReward"><div class="mlwr-top"><strong>🎁 ${tr('مكافأة الترحيب اليومية','Daily welcome reward')}</strong><b>${welcome.day}/15</b></div><p class="mlp-muted">${tr('ابدأ بـ20 نقطة، وتزداد المكافأة 10 نقاط يوميًا لمدة 15 يومًا.','Start with 20 points; the reward increases by 10 points daily for 15 days.')}</p><div class="mlwr-progress"><span style="width:${welcome.day/15*100}%"></span></div><div class="mlwr-top"><span>${welcome.amount} ${tr('نقطة اليوم','points today')}</span><button type="button" id="mlClaimWelcome" ${welcome.claimed||welcome.day>15?'disabled':''}>${welcome.claimed?tr('تم الاستلام اليوم','Claimed today'):tr('استلام المكافأة','Claim reward')}</button></div></div>`;box.insertAdjacentHTML('afterbegin',welcomeHtml);const claim=$('#mlClaimWelcome');if(claim)claim.onclick=claimWelcomeReward;

}
let rewardTimer=null,rewardRotator=null,rewardRemaining=0,rewardAmount=0;
function buildSponsor(){if($('#mlSponsorModal'))return;const m=document.createElement('div');m.id='mlSponsorModal';m.innerHTML=`<div class="mlsponsor-card"><div class="mlsponsor-label">${tr('إعلان','ADVERTISEMENT')} · ${tr('وحدة إعلانية','AD UNIT')}</div><div id="mlsponsorAdSlot" class="mlsponsor-ad-slot" aria-label="Advertisement"></div><div id="mlsponsorCount">20s</div><div class="mlsponsor-track"><span id="mlsponsorFill"></span></div><p class="mlp-muted" style="color:#c4d5ed">${tr('يُعرض هنا الإعلان باستخدام وحدة البنر نفسها الموجودة في التطبيق.','This uses the same banner ad unit already configured in the app.')}</p><button id="mlsponsorClose" disabled>${tr('انتظر...','Please wait...')}</button></div>`;document.body.appendChild(m);}
function startReward(amount){buildSponsor();if(rewardTimer)clearInterval(rewardTimer);if(rewardRotator)clearInterval(rewardRotator);rewardAmount=amount;rewardRemaining=amount;const m=$('#mlSponsorModal');m.classList.add('show');const adSlot=$('#mlsponsorAdSlot');if(adSlot){adSlot.innerHTML='';if(typeof createAdBanner==='function')createAdBanner(adSlot,'large');}function paint(){$('#mlsponsorCount').textContent=rewardRemaining+'s';$('#mlsponsorFill').style.width=(100*(amount-rewardRemaining)/amount)+'%';}paint();rewardRotator=setInterval(()=>{const slot=$('#mlsponsorAdSlot');if(slot&&m.classList.contains('show')&&typeof createAdBanner==='function')createAdBanner(slot,'large');},8000);const close=$('#mlsponsorClose');close.disabled=true;close.textContent=tr('انتظر...','Please wait...');rewardTimer=setInterval(()=>{rewardRemaining--;paint();if(rewardRemaining<=0){clearInterval(rewardTimer);clearInterval(rewardRotator);close.disabled=false;close.textContent=tr('استلام المكافأة','Claim reward');}},1000);close.onclick=()=>{if(rewardRemaining>0)return;m.classList.remove('show');addXP(amount,'reward');};}
function applyColor(){let n=Math.min(10,Math.max(1,Number(localStorage.getItem(KEYS.color)||1)));document.documentElement.style.setProperty('--primary',colorValues[n-1]);document.documentElement.style.setProperty('--primary2',colorValues[(n%10)]);}
function applyReportTemplate(){const n=currentReport();$$('#reportContent .report-container').forEach(el=>{for(let i=1;i<=10;i++)el.classList.remove('ml-template-'+i);el.classList.add('ml-template-'+n)});}
function attachReportSelector(){const content=$('#reportContent');if(!content||!content.querySelector('.report-container')||$('#mlReportToolbar'))return;const toolbar=document.createElement('div');toolbar.id='mlReportToolbar';toolbar.className='report-template-toolbar';toolbar.innerHTML=`<label for="mlReportDesign">${tr('تصميم التقرير','Report design')}</label><select id="mlReportDesign">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${currentReport()===i+1?'selected':''}>${i+1}. ${ar()?reportNames[i]:reportNamesEn[i]}${i+1>earnedReports()?' 🔒':''}</option>`).join('')}</select>`;content.insertAdjacentElement('beforebegin',toolbar);const sel=$('#mlReportDesign');sel.onchange=()=>{let n=Number(sel.value);if(n>earnedReports()){sel.value=String(currentReport());if(typeof window.toast==='function')window.toast(tr('افتح هذا التصميم بالترقي إلى المستوى المطلوب','Unlock this design by reaching the required level'));return}localStorage.setItem(KEYS.report,String(n));applyReportTemplate();};applyReportTemplate();}
function decorateSounds(){const c=$('#calcSoundSelect'),a=$('#settingsAlarmSound');if(c&&!c.dataset.ml20){const old=c.value; c.innerHTML=calcSounds.map((x,i)=>`<option value="mlc${i+1}">${i+1}. ${ar()?x[0]:x[1]}</option>`).join('');c.value=/^mlc\d+$/.test(old)?old:(old==='silent'?'mlc20':({'classic':'mlc1','soft':'mlc2','digital':'mlc3','wood':'mlc4'}[old]||'mlc1'));c.dataset.ml20='1';c.onchange=()=>{try{if(window.DB&&DB.preferences){DB.preferences.calcSound=c.value;if(typeof save==='function')save()}}catch(e){}try{localStorage.setItem('mylife_calc_sound_v2',c.value)}catch(e){}playSynth(c.value,'calc');};}
 if(a&&!a.dataset.ml20){const old=a.value;a.innerHTML=alarmSounds.map((x,i)=>`<option value="mla${i+1}">${i+1}. ${ar()?x[0]:x[1]}</option>`).join('');a.value=/^mla\d+$/.test(old)?old:({'chime':'mla1','digital':'mla2','bell':'mla3','pulse':'mla4'}[old]||'mla1');a.dataset.ml20='1';a.onchange=()=>{try{if(window.DB&&DB.preferences){DB.preferences.timerSound=a.value;if(typeof save==='function')save()}}catch(e){}try{localStorage.setItem('mylife_alarm_sound_v2',a.value)}catch(e){}playSynth(a.value,'alarm');};}
 const ts=$('#timerSoundSelect');if(ts&&!ts.dataset.ml20){const old=ts.value;ts.innerHTML=alarmSounds.map((x,i)=>`<option value="mla${i+1}">${i+1}. ${ar()?x[0]:x[1]}</option>`).join('');ts.value=/^mla\d+$/.test(old)?old:(localStorage.getItem('mylife_alarm_sound_v2')||'mla1');ts.dataset.ml20='1';ts.onchange=()=>{try{if(window.DB&&DB.preferences){DB.preferences.timerSound=ts.value;if(typeof save==='function')save()}}catch(e){}localStorage.setItem('mylife_alarm_sound_v2',ts.value);playSynth(ts.value,'alarm');};}
 const pc=$('#previewCalcSound');if(pc&&!pc.dataset.ml20){pc.dataset.ml20='1';pc.onclick=()=>playSynth(c?.value||localStorage.getItem('mylife_calc_sound_v2')||'mlc1','calc')};const pa=$('#previewSettingsAlarm');if(pa&&!pa.dataset.ml20){pa.dataset.ml20='1';pa.onclick=()=>playSynth(a?.value||localStorage.getItem('mylife_alarm_sound_v2')||'mla1','alarm')};}
function playSynth(id,kind){if(id==='mlc20')return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{const ctx=new C();if(ctx.state==='suspended')ctx.resume();let n=Number(String(id).replace(/\D/g,''))||1;const base=kind==='alarm'?440:320;const types=['sine','triangle','square','sawtooth'];const count=kind==='alarm'?(n%4)+2:1;for(let i=0;i<count;i++){const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=types[(n+i)%types.length];osc.frequency.value=base*(1+((n*7+i*3)%16)/12);g.gain.setValueAtTime(kind==='alarm'?.0001:.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.035,ctx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(kind==='alarm'?.22:.07));osc.connect(g);g.connect(ctx.destination);osc.start(ctx.currentTime+i*(kind==='alarm'?.12:0));osc.stop(ctx.currentTime+(kind==='alarm'?.3:.1)+i*(kind==='alarm'?.12:0));}setTimeout(()=>ctx.close().catch(()=>{}),1500)}catch(e){}}
window.__mlPlaySynth=playSynth;
try{window.__oldPlayStudyTimerAlarm=window.playStudyTimerAlarm;window.playStudyTimerAlarm=function(){const style=(window.DB&&DB.preferences&&DB.preferences.timerSound)||localStorage.getItem('mylife_alarm_sound_v2')||'mla1';if(!/^mla\d+$/.test(style)){if(window.__oldPlayStudyTimerAlarm)window.__oldPlayStudyTimerAlarm();return}playSynth(style,'alarm')}}catch(e){}
try{const originalCalcClick=window.playCalcClick;if(typeof originalCalcClick==='function'){window.playCalcClick=function(kind){const style=(window.DB&&DB.preferences&&DB.preferences.calcSound)||localStorage.getItem('mylife_calc_sound_v2')||'classic';if(/^mlc\d+$/.test(style)){playSynth(style,'calc');return}return originalCalcClick(kind)}}}catch(e){}

// Daily welcome reward: day 1 = 20 XP, then +10 XP/day for up to 15 days.
const WELCOME_KEYS={start:'mylife_welcome_start_v1',claimed:'mylife_welcome_claimed_day_v1'};
function getWelcomeState(){const today=new Date();const dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let start=localStorage.getItem(WELCOME_KEYS.start);if(!start){start=dateKey(today);localStorage.setItem(WELCOME_KEYS.start,start)}const a=new Date(start+'T00:00:00'),b=new Date(dateKey(today)+'T00:00:00');let day=Math.max(1,Math.floor((b-a)/86400000)+1);day=Math.min(15,day);const claimed=localStorage.getItem(WELCOME_KEYS.claimed)===dateKey(today);return {day,amount:20+(day-1)*10,claimed,active:day<=15,date:dateKey(today)}}
function claimWelcomeReward(){const w=getWelcomeState();if(!w.active||w.claimed){if(typeof window.toast==='function')window.toast(tr('تم استلام مكافأة اليوم أو انتهت فترة الترحيب','Today’s reward was already claimed or the welcome period ended'));return}localStorage.setItem(WELCOME_KEYS.claimed,w.date);addXP(w.amount,'welcome reward day '+w.day);renderProgress();}

// Add modest activity XP from foreground time; one award per ten tracked minutes.
function syncTimeXP(){let seconds=safeNum(KEYS.usage);let already=safeNum('mylife_usage_xp_minutes_v2');let minutes=Math.floor(seconds/600);if(minutes>already){let chunks=minutes-already;setNum('mylife_usage_xp_minutes_v2',minutes);addXP(chunks*5,'active use');}}
function syncBadgeXP(){try{const db=window.DB||{},raw=[];if(Array.isArray(db.badges))db.badges.forEach((b,i)=>{if(b&&(b.earned||b.unlocked||b.achieved||b===true))raw.push(String(b.id||b.key||b.name||i))});else if(db.badges&&typeof db.badges==='object')Object.entries(db.badges).forEach(([k,v])=>{if(v&&(v.earned||v.unlocked||v.achieved||v===true))raw.push('badge:'+k)});const current=[...new Set(raw)].sort(),seen=JSON.parse(localStorage.getItem('mylife_seen_badges_v2')||'[]');const fresh=current.filter(x=>!seen.includes(x));if(fresh.length){localStorage.setItem('mylife_seen_badges_v2',JSON.stringify([...new Set([...seen,...fresh])]));addXP(fresh.length*50,'badges')}}catch(e){}}
function init(){addProgressChip();buildModal();buildSponsor();applyColor();applyReportTemplate();attachReportSelector();decorateSounds();syncTimeXP();syncBadgeXP();
 const obs=new MutationObserver(()=>{addProgressChip();attachReportSelector();applyReportTemplate();decorateSounds();});obs.observe(document.body,{childList:true,subtree:true});
 setInterval(syncTimeXP,15000);setInterval(syncBadgeXP,30000);document.addEventListener('visibilitychange',syncTimeXP);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

<script id="mylife-web-notifications-v1">
(function(){
 'use strict';
 const PREF_KEY='mylife_web_notifications_v1', FEED_KEY='mylife_web_notification_feed_v1';
 const isAr=()=>document.documentElement.lang==='ar'||document.documentElement.dir==='rtl'||(typeof window.LANG!=='undefined'&&window.LANG==='ar');
 const tx=(ar,en)=>isAr()?ar:en;
 const defaults={enabled:false,tasks:true,habits:true,health:true,study:true,goals:true,finance:false,notes:false,taskTime:'09:00',habitTime:'08:00',healthTime:'18:00',studyTime:'17:00',goalsTime:'10:00',financeTime:'19:00',notesTime:'20:00',native:false,taskDue:true};
 let prefs=readPrefs(), feed=readFeed(), lastCounts='', timer=null, observer=null;
 function readPrefs(){try{return {...defaults,...JSON.parse(localStorage.getItem(PREF_KEY)||'{}')}}catch(e){return {...defaults}}}
 function writePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));const db=getDB();if(db){db.preferences=db.preferences||{};db.preferences.webNotifications={...prefs};if(typeof window.save==='function')window.save()}}catch(e){}}
 function readFeed(){try{const a=JSON.parse(localStorage.getItem(FEED_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
 function writeFeed(){try{localStorage.setItem(FEED_KEY,JSON.stringify(feed.slice(0,80)))}catch(e){}}
 function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
 function safeArr(v){return Array.isArray(v)?v:[]}
 function getDB(){try{if(typeof DB!=='undefined'&&DB)return DB}catch(e){}return window.DB||window.db||{}}
 function countOpenTasks(){const db=getDB();return safeArr(db.tasks).filter(x=>x&&!x.done&&!x.completed&&!x.isDone&&x.status!=='completed'&&x.status!=='done').length}
 function countHabits(){const db=getDB();return safeArr(db.habits).length}
 function countStudy(){const db=getDB();return safeArr(db.study&&db.study.tasks).filter(x=>x&&!x.done&&!x.completed&&x.status!=='done').length}
 function countGoals(){const db=getDB();return safeArr(db.goals).filter(x=>x&&!x.completed&&!x.done&&x.status!=='completed').length}
 function counts(){return {tasks:countOpenTasks(),habits:countHabits(),health:0,study:countStudy(),goals:countGoals(),finance:safeArr(getDB().finance&&getDB().finance.entries).length,notes:safeArr(getDB().notes).length}}
 function remember(item){feed.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),...item,at:Date.now(),read:false});feed=feed.slice(0,80);writeFeed();updateBadge()}
 function updateBadge(){const b=document.getElementById('mlWebNotifBtn');if(!b)return;const unread=feed.some(x=>!x.read);b.classList.toggle('has-unread',unread);b.setAttribute('aria-label',tx('الإشعارات','Notifications'));b.title=tx('الإشعارات','Notifications')}
 function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function addNotice(title,body,category='general',key){const day=dateKey();const dedupe=key||category+'-'+day+'-'+title;if(feed.some(n=>n.dedupe===dedupe))return;remember({title,body,category,dedupe});if(prefs.enabled&&prefs.native&&'Notification'in window&&Notification.permission==='granted'&&document.visibilityState==='visible'){try{new Notification(title,{body,tag:dedupe,icon:'./favicon.ico',silent:false})}catch(e){}}
  if(typeof window.toast==='function'&&document.visibilityState==='visible'){try{window.toast('🔔 '+title+': '+body)}catch(e){}}
 }
 function maybeDaily(category,enabled,time,title,body){if(!prefs.enabled||!prefs[enabled])return;const now=new Date(),hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');if(hh+':'+mm!==prefs[time])return;const k='sent:'+category+':'+dateKey();if(localStorage.getItem('mylife_web_notif_'+k))return;localStorage.setItem('mylife_web_notif_'+k,'1');addNotice(title,body,category,k)}
 function scan(){if(!prefs.enabled||document.visibilityState==='prerender')return;const c=counts(),now=new Date();
  maybeDaily('tasks','tasks','taskTime',tx('تذكير بالمهام','Task reminder'),c.tasks?tx('لديك '+c.tasks+' مهام غير مكتملة. افتح التطبيق ورتّب أولوياتك.','You have '+c.tasks+' open tasks. Review your priorities.'):tx('راجع قائمة مهامك لليوم.','Take a moment to review today’s task list.'));
  maybeDaily('habits','habits','habitTime',tx('حان وقت العادات','Habit check-in'),c.habits?tx('حافظ على استمراريتك وسجّل عاداتك اليوم.','Keep your streak going and check in on your habits.'):tx('أضف عادة صغيرة تساعدك على التقدم.','Add a small habit to help you make progress.'));
  maybeDaily('health','health','healthTime',tx('تذكير بالصحة والتمارين','Health & exercise reminder'),tx('حان وقت الحركة أو شرب الماء أو مراجعة أهدافك الصحية.','Time to move, drink water, or review your health goals.'));
  maybeDaily('study','study','studyTime',tx('وقت الدراسة','Study reminder'),c.study?tx('لديك '+c.study+' مهام دراسية غير مكتملة.','You have '+c.study+' unfinished study tasks.'):tx('خصص بعض الوقت للتعلم اليوم.','Make a little time for learning today.'));
  maybeDaily('goals','goals','goalsTime',tx('خطوة نحو أهدافك','Goal reminder'),c.goals?tx('راجع أهدافك واختر خطوة صغيرة للتقدم.','Review your goals and choose one small next step.'):tx('راجع تقدمك نحو أهدافك.','Review your progress toward your goals.'));
  maybeDaily('finance','finance','financeTime',tx('مراجعة مالية','Finance check-in'),tx('راجع دخلك ومصروفاتك وسجّل أي حركة جديدة.','Review your income and expenses and record new activity.'));
  maybeDaily('notes','notes','notesTime',tx('وقت مراجعة الملاحظات','Notes reminder'),tx('راجع أفكارك وملاحظاتك المهمة.','Review your ideas and important notes.'));
  if(prefs.taskDue){const day=dateKey();for(const task of safeArr(getDB().tasks)){if(!task||task.done||task.completed||task.isDone)continue;const due=task.dueDate||task.due||task.date||task.deadline;if(!due)continue;const dueDate=String(due).slice(0,10);if(dueDate===day){const title=task.title||task.name||task.text||tx('مهمة مستحقة اليوم','Task due today');const key='due:'+String(task.id||task.uid||title)+':'+day;if(!feed.some(n=>n.dedupe===key))addNotice(tx('موعد مهمة','Task due'),tx('تذكير: ','Reminder: ')+title,'tasks',key)}}}
 }
 function openPanel(mode='settings'){
  document.querySelector('.mlwn-overlay')?.remove();
  const overlay=document.createElement('div');overlay.className='mlwn-overlay';overlay.setAttribute('role','presentation');
  const panel=document.createElement('section');panel.className='mlwn-panel';panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label',tx('إشعارات My Life','My Life notifications'));
  overlay.appendChild(panel);document.body.appendChild(overlay);
  const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  const heading=`<div class="mlwn-head"><h2>🔔 ${mode==='feed'?tx('الإشعارات','Notifications'):tx('إعدادات الإشعارات','Notification settings')}</h2><button class="mlwn-close" type="button" aria-label="${tx('إغلاق','Close')}">✕</button></div>`;
  panel.innerHTML=heading+(mode==='feed'?renderFeed():renderSettings());panel.querySelector('.mlwn-close').onclick=close;
  if(mode==='feed'){
    panel.querySelector('[data-mlwn-settings]')?.addEventListener('click',()=>openPanel('settings'));
    panel.querySelector('[data-mlwn-clear]')?.addEventListener('click',()=>{feed=[];writeFeed();panel.querySelector('.mlwn-feed').innerHTML=`<div class="mlwn-empty">${tx('لا توجد إشعارات حالياً.','No notifications yet.')}</div>`;updateBadge()});
    feed.forEach(n=>n.read=true);writeFeed();updateBadge();
  } else bindSettings(panel);
 }
 function renderFeed(){return `<p class="mlwn-sub">${tx('تذكيرات المهام والعادات والصحة والدراسة والأهداف. تعمل إشعارات المتصفح عندما تكون الصفحة مفتوحة، بحسب إعدادات المتصفح.','Task, habit, health, study and goal reminders. Browser reminders run while the page is open, subject to browser permissions.')}</p><div class="mlwn-feed">${feed.length?feed.map(n=>`<div class="mlwn-feed-item"><span class="mlwn-feed-icon">${n.category==='tasks'?'📋':n.category==='habits'?'🔁':n.category==='health'?'🏃':n.category==='study'?'🎓':n.category==='goals'?'🎯':n.category==='finance'?'💰':'🔔'}</span><div><strong>${esc(n.title)}</strong><small>${esc(n.body)} · ${new Date(n.at).toLocaleString(isAr()?'ar':'en')}</small></div></div>`).join(''):`<div class="mlwn-empty">${tx('لا توجد إشعارات حالياً. فعّل التذكيرات من الإعدادات.','No notifications yet. Enable reminders in settings.')}</div>`}</div><div class="mlwn-actions"><button class="mlwn-btn primary" data-mlwn-settings>${tx('إعدادات الإشعارات','Notification settings')}</button><button class="mlwn-btn" data-mlwn-clear>${tx('مسح السجل','Clear history')}</button></div>`}
 const categories=[
  ['tasks','taskTime','📋','المهام','Tasks','تذكير يومي بالمهام والمواعيد.','Daily task and due-date reminders.'],
  ['habits','habitTime','🔁','العادات','Habits','تذكير بالاستمرارية وتسجيل العادات.','Daily habit check-ins.'],
  ['health','healthTime','🏃','الصحة والتمارين والماء','Health, exercise & water','تذكير بالحركة وشرب الماء والراحة.','Movement, hydration and wellness prompts.'],
  ['study','studyTime','🎓','الدراسة والتعلم','Study & learning','تذكير بمهام الدراسة.','Study-task reminders.'],
  ['goals','goalsTime','🎯','الأهداف والتقدم','Goals & progress','تذكير بمراجعة أهدافك.','Goal-review reminders.'],
  ['finance','financeTime','💰','المالية','Finance','تذكير بمراجعة الدخل والمصروفات.','Review income and expenses.'],
  ['notes','notesTime','📝','الملاحظات','Notes','تذكير بمراجعة أفكارك.','Review saved notes.']
 ];
 function renderSettings(){return `<p class="mlwn-sub">${tx('اختر أنواع التذكيرات ووقتها. يلزم السماح بإشعارات المتصفح لإظهار تنبيهات النظام. لا يتم إرسال إشعارات سحابية عندما تكون الصفحة مغلقة في هذه النسخة أحادية الملف.','Choose reminder categories and times. Browser permission is required for system notifications. This single-file version does not send cloud push notifications while the page is closed.')}</p><label class="mlwn-item" style="grid-template-columns:auto minmax(0,1fr);margin-bottom:12px"><input id="mlwn-enabled" type="checkbox" ${prefs.enabled?'checked':''}><span><span class="mlwn-label">${tx('تفعيل التذكيرات','Enable reminders')}</span><span class="mlwn-desc">${tx('تشغيل أو إيقاف جميع التذكيرات من مكان واحد.','Turn all reminders on or off in one place.')}</span></span></label><div class="mlwn-list">${categories.map(([key,time,icon,ar,en,da,de])=>`<label class="mlwn-item"><input type="checkbox" data-cat="${key}" ${prefs[key]?'checked':''}><span><span class="mlwn-label">${icon} ${tx(ar,en)}</span><span class="mlwn-desc">${tx(da,de)}</span></span><input class="mlwn-time" type="time" data-time="${time}" value="${esc(prefs[time])}" aria-label="${tx('وقت التذكير','Reminder time')}: ${tx(ar,en)}"></label>`).join('')}<label class="mlwn-item" style="grid-template-columns:auto minmax(0,1fr)"><input id="mlwn-due" type="checkbox" ${prefs.taskDue?'checked':''}><span><span class="mlwn-label">📅 ${tx('تذكيرات المهام المستحقة اليوم','Due-today task reminders')}</span><span class="mlwn-desc">${tx('التنبيه عند وجود مهمة بتاريخ استحقاق اليوم أثناء فتح الموقع.','Alert for tasks due today while the site is open.')}</span></span></label></div><div class="mlwn-status" id="mlwn-status">${statusText()}</div><div class="mlwn-actions"><button class="mlwn-btn primary" id="mlwn-save">${tx('حفظ الإعدادات','Save settings')}</button><button class="mlwn-btn" id="mlwn-permission">${tx('السماح بإشعارات المتصفح','Allow browser notifications')}</button><button class="mlwn-btn" id="mlwn-test">${tx('إرسال إشعار تجريبي','Send test notification')}</button></div>`}
 function statusText(){if(!('Notification'in window))return tx('هذا المتصفح لا يدعم إشعارات النظام؛ سيبقى سجل الإشعارات داخل الموقع متاحاً.','This browser does not support system notifications; the in-site notification center remains available.');if(Notification.permission==='granted')return tx('إذن إشعارات المتصفح: مسموح.','Browser notification permission: granted.');if(Notification.permission==='denied')return tx('إشعارات المتصفح محظورة من إعدادات المتصفح. غيّر الإذن من إعدادات الموقع.','Browser notifications are blocked. Change permission in browser site settings.');return tx('إذن إشعارات المتصفح لم يُطلب بعد.','Browser notification permission has not been requested yet.')}
 function bindSettings(panel){
  panel.querySelector('#mlwn-permission').onclick=async()=>{if(!('Notification'in window)){panel.querySelector('#mlwn-status').textContent=statusText();return}try{const p=await Notification.requestPermission();prefs.native=p==='granted';writePrefs();panel.querySelector('#mlwn-status').textContent=statusText()}catch(e){panel.querySelector('#mlwn-status').textContent=statusText()}};
  panel.querySelector('#mlwn-save').onclick=()=>{prefs.enabled=panel.querySelector('#mlwn-enabled').checked;panel.querySelectorAll('[data-cat]').forEach(el=>prefs[el.dataset.cat]=el.checked);panel.querySelectorAll('[data-time]').forEach(el=>{if(/^\d\d:\d\d$/.test(el.value))prefs[el.dataset.time]=el.value});prefs.taskDue=panel.querySelector('#mlwn-due').checked;writePrefs();panel.querySelector('#mlwn-status').textContent=tx('تم حفظ الإعدادات على هذا المتصفح. ستعمل التذكيرات أثناء فتح الموقع.','Settings saved in this browser. Reminders run while the site is open.');if(timer)clearInterval(timer);timer=setInterval(scan,15000);scan()};
  panel.querySelector('#mlwn-test').onclick=()=>{const title=tx('إشعار تجريبي من My Life','My Life test notification'),body=tx('الإشعارات تعمل كما هو متوقع داخل الموقع.','Your in-site notifications are working.');addNotice(title,body,'general','test-'+Date.now());if(prefs.native&&'Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}panel.querySelector('#mlwn-status').textContent=tx('تم إنشاء إشعار تجريبي. إذا لم يظهر تنبيه النظام، تحقق من إذن المتصفح.','A test notice was created. If no system alert appeared, check browser permission.')}}
 function addHeaderButton(){const header=document.querySelector('.app>header');if(!header||document.getElementById('mlWebNotifBtn'))return;const btn=document.createElement('button');btn.type='button';btn.className='icon-btn';btn.id='mlWebNotifBtn';btn.innerHTML='🔔<span class="ml-web-notif-dot" aria-hidden="true"></span>';btn.title=tx('الإشعارات','Notifications');btn.setAttribute('aria-label',btn.title);btn.addEventListener('click',()=>openPanel('feed'));const settings=document.getElementById('settingsBtn');if(settings&&settings.parentNode===header)header.insertBefore(btn,settings);else header.appendChild(btn);updateBadge()}
 function addSettingsCard(){const stack=document.querySelector('#view .settings-stack');if(!stack||stack.querySelector('#mlwn-settings-card'))return;const card=document.createElement('section');card.className='mlwn-settings-card';card.id='mlwn-settings-card';card.innerHTML=`<h3>🔔 ${tx('إشعارات الموقع','Website notifications')}</h3><p>${tx('فعّل تذكيرات المهام والعادات والتمارين والدراسة والأهداف والمالية، وحدد وقت كل تذكير.','Enable reminders for tasks, habits, exercise, study, goals and finance, and choose each reminder time.')}</p><button type="button" id="mlwn-open-settings">${tx('إدارة الإشعارات','Manage notifications')}</button>`;stack.appendChild(card);card.querySelector('button').onclick=()=>openPanel('settings')}
 function init(){
  try{const db=getDB();if(db.preferences&&db.preferences.webNotifications&&!localStorage.getItem(PREF_KEY)){prefs={...prefs,...db.preferences.webNotifications};writePrefs()}}catch(e){}
  addHeaderButton();addSettingsCard();if(observer)observer.disconnect();observer=new MutationObserver(()=>{addHeaderButton();addSettingsCard()});observer.observe(document.body,{childList:true,subtree:true});
  if(timer)clearInterval(timer);timer=setInterval(scan,15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scan()});
  // Keep a compact in-app feed updated as app data changes without replacing existing app functions.
  setInterval(()=>{const c=counts(),sig=JSON.stringify(c);if(lastCounts&&sig!==lastCounts){const prev=JSON.parse(lastCounts);if(c.tasks<prev.tasks)addNotice(tx('تحديث المهام','Task update'),tx('تم تقليل عدد المهام غير المكتملة.','The number of open tasks has decreased.'),'tasks','task-progress-'+dateKey()+'-'+c.tasks);if(c.habits>prev.habits)addNotice(tx('عادة جديدة','New habit'),tx('تمت إضافة عادة إلى قائمتك.','A habit was added to your list.'),'habits','habit-added-'+dateKey()+'-'+c.habits);if(c.goals>prev.goals)addNotice(tx('هدف جديد','New goal'),tx('تمت إضافة هدف جديد.','A new goal was added.'),'goals','goal-added-'+dateKey()+'-'+c.goals)}lastCounts=sig},5000);
 }
 window.MyLifeWebNotifications={open:openPanel,scan:scan,add:addNotice,getPreferences:()=>({...prefs})};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
